<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DARK NOVA — Character Compendium</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #1a1a24;
    --border: #2a2a3a;
    --accent: #7c6dfa;
    --accent2: #fa6d8a;
    --text: #e8e8f0;
    --muted: #6b6b85;
    --power: #fa6d6d;
    --control: #6daaff;
    --support: #6dfaaa;
    --speed: #fadc6d;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  /* HEADER */
  header {
    padding: 3rem 2rem 2rem;
    border-bottom: 1px solid var(--border);
    position: relative;
    overflow: hidden;
  }
  header::before {
    content: '';
    position: absolute;
    top: -60px; left: -40px;
    width: 400px; height: 300px;
    background: radial-gradient(ellipse, rgba(124,109,250,0.15) 0%, transparent 70%);
    pointer-events: none;
  }
  header::after {
    content: '';
    position: absolute;
    top: -40px; right: 10%;
    width: 300px; height: 250px;
    background: radial-gradient(ellipse, rgba(250,109,138,0.1) 0%, transparent 70%);
    pointer-events: none;
  }

  .header-inner {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
    position: relative;
    z-index: 1;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3rem, 8vw, 6rem);
    letter-spacing: 0.05em;
    line-height: 0.9;
    background: linear-gradient(135deg, #fff 0%, var(--accent) 60%, var(--accent2) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .logo span {
    display: block;
    font-size: 0.4em;
    letter-spacing: 0.3em;
    background: linear-gradient(90deg, var(--muted), var(--accent));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .header-meta {
    text-align: right;
    color: var(--muted);
    font-size: 0.8rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .header-meta strong {
    display: block;
    font-size: 1.8rem;
    font-family: 'Bebas Neue', sans-serif;
    color: var(--text);
    letter-spacing: 0.05em;
  }

  /* FILTERS */
  .filters-wrap {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 1rem 2rem;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .filters {
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    gap: 0.6rem;
    align-items: center;
  }

  .filter-label {
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--muted);
    margin-right: 0.4rem;
  }

  .filter-group {
    display: flex;
    flex-wrap: wrap;
    gap: 0.4rem;
    align-items: center;
  }

  .filter-divider {
    width: 1px;
    height: 24px;
    background: var(--border);
    margin: 0 0.4rem;
  }

  .chip {
    padding: 4px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.75rem;
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }

  .chip:hover { border-color: var(--accent); color: var(--text); }
  .chip.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chip.active-role-Attacker { background: #fa6d6d33; border-color: #fa6d6d; color: #fa6d6d; }
  .chip.active-role-Support { background: #6dfaaa33; border-color: #6dfaaa; color: #6dfaaa; }
  .chip.active-role-Tank { background: #6daaff33; border-color: #6daaff; color: #6daaff; }
  .chip.active-role-Disruptor { background: #fadc6d33; border-color: #fadc6d; color: #fadc6d; }

  .search-wrap {
    margin-left: auto;
  }

  .search-wrap input {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 14px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 0.8rem;
    outline: none;
    width: 180px;
    transition: border-color 0.15s;
  }

  .search-wrap input:focus { border-color: var(--accent); }
  .search-wrap input::placeholder { color: var(--muted); }

  /* RESULTS COUNT */
  .results-bar {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0.8rem 2rem;
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 0.05em;
  }

  /* GRID */
  .grid {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 2rem 4rem;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1px;
    background: var(--border);
  }

  /* CARD */
  .card {
    background: var(--bg);
    padding: 1.4rem;
    cursor: pointer;
    transition: background 0.15s;
    position: relative;
    overflow: hidden;
  }

  .card:hover { background: var(--surface); }

  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 0.8rem;
  }

  .card-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.3rem;
    letter-spacing: 0.05em;
    line-height: 1;
    color: var(--text);
  }

  .card-pronouns {
    font-size: 0.7rem;
    color: var(--muted);
    margin-top: 2px;
  }

  .role-badge {
    font-size: 0.65rem;
    font-weight: 500;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    padding: 3px 8px;
    border-radius: 4px;
    flex-shrink: 0;
  }

  .role-Attacker { background: #fa6d6d22; color: #fa6d6d; border: 1px solid #fa6d6d44; }
  .role-Support  { background: #6dfaaa22; color: #6dfaaa; border: 1px solid #6dfaaa44; }
  .role-Tank     { background: #6daaff22; color: #6daaff; border: 1px solid #6daaff44; }
  .role-Disruptor{ background: #fadc6d22; color: #fadc6d; border: 1px solid #fadc6d44; }

  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 1rem;
  }

  .tag {
    font-size: 0.65rem;
    color: var(--muted);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 2px 6px;
    letter-spacing: 0.05em;
  }

  /* STATS */
  .stats { display: flex; flex-direction: column; gap: 5px; }

  .stat-row {
    display: grid;
    grid-template-columns: 56px 1fr 28px;
    align-items: center;
    gap: 8px;
  }

  .stat-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
  }

  .stat-bar-bg {
    height: 4px;
    background: var(--surface2);
    border-radius: 2px;
    overflow: hidden;
  }

  .stat-bar-fill {
    height: 100%;
    border-radius: 2px;
    transition: width 0.3s ease;
  }

  .stat-val {
    font-size: 0.7rem;
    font-weight: 500;
    text-align: right;
    color: var(--text);
  }

  .fill-power   { background: var(--power); }
  .fill-control { background: var(--control); }
  .fill-support { background: var(--support); }
  .fill-speed   { background: var(--speed); }

  .card-ability {
    margin-top: 0.9rem;
    padding-top: 0.9rem;
    border-top: 1px solid var(--border);
    font-size: 0.75rem;
    color: var(--muted);
  }

  .card-ability strong {
    color: var(--accent);
    font-weight: 500;
    display: block;
    margin-bottom: 2px;
    font-size: 0.8rem;
  }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.8);
    z-index: 1000;
    padding: 2rem;
    overflow-y: auto;
    backdrop-filter: blur(4px);
  }

  .modal-overlay.open { display: flex; align-items: flex-start; justify-content: center; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 100%;
    max-width: 560px;
    margin: auto;
    overflow: hidden;
    animation: modalIn 0.2s ease;
  }

  @keyframes modalIn {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .modal-header {
    padding: 1.8rem 1.8rem 1.2rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
  }

  .modal-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 2.2rem;
    letter-spacing: 0.05em;
    line-height: 1;
  }

  .modal-sub {
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 4px;
  }

  .modal-close {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    width: 32px; height: 32px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 1rem;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: all 0.15s;
  }

  .modal-close:hover { border-color: var(--accent2); color: var(--accent2); }

  .modal-body { padding: 1.5rem 1.8rem; }

  .modal-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 1.4rem;
  }

  .modal-tag {
    font-size: 0.72rem;
    padding: 4px 10px;
    border-radius: 4px;
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    letter-spacing: 0.05em;
  }

  .modal-stats {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 1.4rem;
  }

  .modal-stat-row {
    display: grid;
    grid-template-columns: 70px 1fr 32px;
    align-items: center;
    gap: 10px;
  }

  .modal-stat-label { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); }
  .modal-stat-val { font-size: 0.8rem; font-weight: 500; text-align: right; }

  .modal-stat-bar-bg { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; }
  .modal-stat-fill { height: 100%; border-radius: 3px; }

  .modal-section { margin-bottom: 1.2rem; }
  .modal-section-title {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .modal-ability-name {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.4rem;
    letter-spacing: 0.05em;
    color: var(--accent);
    margin-bottom: 4px;
  }

  .modal-text {
    font-size: 0.82rem;
    color: var(--text);
    line-height: 1.6;
  }

  .modal-drawback {
    background: #fa6d6d0d;
    border: 1px solid #fa6d6d22;
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 0.8rem;
    color: #fa9090;
    line-height: 1.5;
  }

  .traits-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .trait-box {
    background: var(--surface2);
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 0.75rem;
    line-height: 1.6;
  }

  .trait-box .trait-label {
    font-size: 0.65rem;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--muted);
    margin-bottom: 4px;
    display: block;
  }

  .trait-pos { color: #6dfaaa; }
  .trait-neg { color: #fa9090; }

  /* EMPTY */
  .empty {
    grid-column: 1/-1;
    text-align: center;
    padding: 4rem;
    color: var(--muted);
    font-size: 0.9rem;
  }

  .troupe-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 0.85rem;
    letter-spacing: 0.15em;
    color: var(--muted);
    margin-bottom: 3px;
  }
</style>
</head>
<body>

<header>

    <div class="logo">
      Dark Nova
      <span>Character Compendium</span>
    </div>
    <div class="header-meta">

</header>

    <div class="filter-divider"></div>

      <input type="text" id="search" placeholder="Search name or element...">
    </div>
  </div>
</div>

<div class="results-bar" id="results-bar">Showing 40 characters</div>

<div class="grid" id="grid"></div>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div>
        <div class="modal-name" id="m-name"></div>
        <div class="modal-sub" id="m-sub"></div>
      </div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-tags" id="m-tags"></div>
      <div class="modal-stats" id="m-stats"></div>
      <div class="modal-section">
        <div class="modal-section-title">Signature Ability</div>
        <div class="modal-ability-name" id="m-ability"></div>
      </div>
      <div class="modal-section">
        <div class="modal-section-title">Drawback</div>
        <div class="modal-drawback" id="m-drawback"></div>
      </div>
      <div class="modal-section">
        <div class="modal-section-title">Traits</div>
        <div class="traits-row">
          <div class="trait-box">
            <span class="trait-label">Positive</span>
            <div class="trait-pos" id="m-pos"></div>
          </div>
          <div class="trait-box">
            <span class="trait-label">Negative</span>
            <div class="trait-neg" id="m-neg"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

let activeFilters = { role: 'all', troupe: 'all', mbti: 'all' };
let searchQuery = '';

function statColor(val) {
  if (val >= 80) return '#6dfaaa';
  if (val >= 60) return '#fadc6d';
  if (val >= 40) return '#fa9a6d';
  return '#fa6d6d';
}

function renderCard(c) {
  const div = document.createElement('div');
  div.className = 'card';
  div.onclick = () => openModal(c);
  div.innerHTML = `
    <div class="card-top">
      <div>
        <div class="troupe-label">Troupe ${c.Troupe} · ${c.Group}</div>
        <div class="card-name">${c.Name}</div>
        <div class="card-pronouns">${c.Pronouns}</div>
      </div>
      <span class="role-badge role-${c.Role}">${c.Role}</span>
    </div>
    <div class="card-tags">
      <span class="tag">${c.Element}</span>
      <span class="tag">${c.MBTI}</span>
      <span class="tag">${c['MBTI Family']}</span>
      <span class="tag">${c.Aspect}</span>
    </div>
    <div class="stats">
      ${['Power','Control','Support','Speed'].map(s => `
        <div class="stat-row">
          <div class="stat-label">${s}</div>
          <div class="stat-bar-bg"><div class="stat-bar-fill fill-${s.toLowerCase()}" style="width:${c[s]}%"></div></div>
          <div class="stat-val" style="color:${statColor(c[s])}">${c[s]}</div>
        </div>`).join('')}
    </div>
    <div class="card-ability">
      <strong>${c.Signature_Ability}</strong>
      ${c['Drawback Type']} drawback
    </div>
  `;
  return div;
}

function applyFilters() {
  const q = searchQuery.toLowerCase();
  const filtered = characters.filter(c => {
    const roleOk = activeFilters.role === 'all' || c.Role === activeFilters.role;
    const troupeOk = activeFilters.troupe === 'all' || String(c.Troupe) === activeFilters.troupe;
    const mbtiOk = activeFilters.mbti === 'all' || c['MBTI Family'] === activeFilters.mbti;
    const searchOk = !q || c.Name.toLowerCase().includes(q) || c.Element.toLowerCase().includes(q) || c.Group.toLowerCase().includes(q);
    return roleOk && troupeOk && mbtiOk && searchOk;
  });

  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  if (filtered.length === 0) {
    grid.innerHTML = '<div class="empty">No characters match your filters.</div>';
  } else {
    filtered.forEach(c => grid.appendChild(renderCard(c)));
  }
  document.getElementById('results-bar').textContent =
    `Showing ${filtered.length} of ${characters.length} characters`;
}

document.querySelectorAll('.chip').forEach(chip => {
  chip.addEventListener('click', () => {
    const filterType = chip.dataset.filter;
    const value = chip.dataset.value;
    activeFilters[filterType] = value;
    document.querySelectorAll(`[data-filter="${filterType}"]`).forEach(c => {
      c.className = 'chip';
      if (c.dataset.value === value) {
        c.classList.add(value === 'all' ? 'active' : `active-role-${value}`);
      }
    });
    applyFilters();
  });
});

document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value;
  applyFilters();
});

function openModal(c) {
  document.getElementById('m-name').textContent = c.Name;
  document.getElementById('m-sub').textContent = `${c.Pronouns} · Troupe ${c.Troupe} · ${c.Group} · ${c['Height (cm)']}cm`;
  document.getElementById('m-tags').innerHTML = [
    c.Element, c.Aspect, c.MBTI, c['MBTI Family'], c.Role, c['Drawback Type'] + ' Drawback'
  ].map(t => `<span class="modal-tag">${t}</span>`).join('');

  document.getElementById('m-stats').innerHTML = ['Power','Control','Support','Speed'].map(s => `
    <div class="modal-stat-row">
      <div class="modal-stat-label">${s}</div>
      <div class="modal-stat-bar-bg"><div class="modal-stat-fill fill-${s.toLowerCase()}" style="width:${c[s]}%"></div></div>
      <div class="modal-stat-val" style="color:${statColor(c[s])}">${c[s]}</div>
    </div>`).join('');

  document.getElementById('m-ability').textContent = c.Signature_Ability;
  document.getElementById('m-drawback').textContent = c.Drawback_Summary;
  document.getElementById('m-pos').textContent = c['Positive Traits'].replace(/ \/ /g, '\n');
  document.getElementById('m-neg').textContent = c['Negative Traits'].replace(/ \/ /g, '\n');

  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});

document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

applyFilters();
</script>
