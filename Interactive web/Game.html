<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elemental Academy Adventure</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: 'Georgia', serif;
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .game-container {
            background: rgba(0, 0, 0, 0.8);
            border-radius: 20px;
            padding: 40px;
            max-width: 900px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .title {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 30px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4);
            background-size: 400% 400%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: gradientShift 3s ease infinite;
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .character-selection {
            text-align: center;
            margin-bottom: 30px;
        }

        .character-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        .character-card {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.05));
            border: 2px solid transparent;
            border-radius: 15px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
        }

        .character-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .character-card.selected {
            border-color: #4ecdc4;
            box-shadow: 0 0 20px rgba(78, 205, 196, 0.5);
        }

        .character-name {
            font-weight: bold;
            font-size: 1.2em;
            margin-bottom: 8px;
        }

        .character-element {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .character-trait {
            font-size: 0.8em;
            opacity: 0.7;
        }

        .game-content {
            display: none;
        }

        .scenario {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .choices {
            display: grid;
            gap: 15px;
            margin-top: 20px;
        }

        .choice-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 10px;
            padding: 15px 20px;
            color: white;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
            text-align: left;
        }

        .choice-btn:hover {
            transform: translateX(10px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin: 20px 0;
            flex-wrap: wrap;
        }

        .stat {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 10px 15px;
            margin: 5px;
            text-align: center;
            min-width: 120px;
        }

        .start-btn {
            background: linear-gradient(135deg, #4ecdc4, #44a08d);
            border: none;
            border-radius: 10px;
            padding: 15px 30px;
            color: white;
            font-size: 1.2em;
            cursor: pointer;
            display: block;
            margin: 20px auto;
            transition: all 0.3s ease;
        }

        .start-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .relationship-indicator {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 15px;
            font-size: 0.8em;
            margin: 2px;
        }

        .best-friend { background-color: #4ecdc4; }
        .close-friend { background-color: #45b7d1; }
        .rival { background-color: #ff6b6b; }
        .romantic { background-color: #ff9ff3; }
    </style>
</head>
<body>
    <div class="game-container">
        <h1 class="title">Elemental Academy Adventure</h1>
        
        <div class="character-selection" id="characterSelection">
            <h2>Choose Your Character</h2>
            <p>Select who you want to play as in this adventure:</p>
            
            <div class="character-grid" id="characterGrid">
                <!-- Characters will be populated by JavaScript -->
            </div>
            
            <button class="start-btn" id="startGame" onclick="startGame()" disabled>Start Adventure</button>
        </div>

        <div class="game-content" id="gameContent">
            <div class="stats" id="stats">
                <!-- Stats will be shown here -->
            </div>
            
            <div class="scenario" id="scenario">
                <!-- Current scenario will be shown here -->
            </div>
            
            <div class="choices" id="choices">
                <!-- Choice buttons will be shown here -->
            </div>
        </div>
    </div>

    <script>
        const characters = {
            "Liam Reed": {
                element: "Fire",
                traits: ["Bold, curious, and always chasing the next experience. Loves trying new things and dragging the group into unexpected adventures."],
                relationships: ["Best friends: Rowan, Jae", "Romantic interest: Rowan/Merula"]
            },
            "Rowan Khanna": {
                element: "Sound", 
                traits: ["Smart and resourceful, always has a plan or solution."],
                relationships: ["Best friends: Liam, Ben", "Romantic interest: Liam/Ben"]
            },
            "Ben Copper": {
                element: "Earth",
                traits: ["Constantly analyzing situations, sometimes worries too much but sees hidden angles."],
                relationships: ["Best friends: Rowan", "Close friends: Liam, Jae"]
            },
            "Jae Kim": {
                element: "Wind/Air",
                traits: ["Always cracking jokes, lightens the mood when things get tense."],
                relationships: ["Best friends: Liam", "Close friends: Ben, Rowan"]
            },
            "Penny Haywood": {
                element: "Light",
                traits: ["Social butterfly who links people together, great at networking or matchmaking."],
                relationships: ["Best friends: Mayumi", "Close friends: Chiara, Jae"]
            },
             "Mayumi Sasaki": {
                element: "Nature",
                traits: ["Quiet, observant, but often surprises the group with insight or bravery."],
                relationships: ["Best friends: Penny, Chiara", "Close friends: Barnaby"]
            },
             "Chiara Lobosca": {
                element: "Water",
                traits: ["Nurturing, empathetic, and emotionally supportive to others."],
                relationships: ["Best friends: Mayumi", "Close friends: Penny, Barnaby"]
            },
            "Merula Snyde": {
                element: "Shadow",
                traits: ["Spontaneous", "Creative", "Unpredictable"],
                relationships: ["Frenemies with most", "Secret soft spot: Liam"]
            }
            
        };

        let selectedCharacter = null;
        let gameState = {
            trust: 50,
            courage: 50,
            relationships: 50,
            scenario: 0
        };

        const scenarios = [
            {
                text: "You're in the academy courtyard when you notice tension building between two groups of students. A practice duel has gotten heated, and elemental powers are starting to flare dangerously. What do you do?",
                choices: [
                    { text: "Jump in immediately to break up the fight", effects: { courage: 10, trust: -5 } },
                    { text: "Try to calm everyone down with words first", effects: { relationships: 10, trust: 5 } },
                    { text: "Find a teacher to handle the situation", effects: { trust: 5, courage: -5 } },
                    { text: "Use your elemental power to create a distraction", effects: { courage: 5, relationships: -5 } }
                ]
            },
            {
                text: "During a group study session, you overhear a conversation about someone spreading rumors about your friend. The rumors could damage their reputation and relationships. How do you handle this?",
                choices: [
                    { text: "Confront the rumor-spreader directly", effects: { courage: 10, relationships: -5 } },
                    { text: "Talk to your friend about what you heard", effects: { trust: 10, relationships: 5 } },
                    { text: "Try to subtly counter the rumors with positive stories", effects: { relationships: 10, trust: 5 } },
                    { text: "Investigate to find out if the rumors are true first", effects: { trust: -5, courage: 5 } }
                ]
            },
            {
                text: "The academy is hosting an inter-elemental tournament, and your team needs to decide on strategy. There's disagreement about whether to play it safe or take big risks for spectacular moves. What's your approach?",
                choices: [
                    { text: "Advocate for the high-risk, high-reward strategy", effects: { courage: 15, trust: -5 } },
                    { text: "Suggest a balanced approach that incorporates both ideas", effects: { relationships: 15, trust: 10 } },
                    { text: "Support the safer strategy to ensure success", effects: { trust: 10, courage: -10 } },
                    { text: "Propose letting everyone showcase their individual strengths", effects: { relationships: 10, courage: 5 } }
                ]
            }
        ];

        function populateCharacters() {
            const grid = document.getElementById('characterGrid');
            
            Object.entries(characters).forEach(([name, info]) => {
                const card = document.createElement('div');
                card.className = 'character-card';
                card.onclick = () => selectCharacter(name, card);
                
                card.innerHTML = `
                    <div class="character-name">${name}</div>
                    <div class="character-element">Element: ${info.element}</div>
                    <div class="character-trait">${info.traits.join(', ')}</div>
                `;
                
                grid.appendChild(card);
            });
        }

        function selectCharacter(name, cardElement) {
            document.querySelectorAll('.character-card').forEach(card => {
                card.classList.remove('selected');
            });
            
            cardElement.classList.add('selected');
            selectedCharacter = name;
            document.getElementById('startGame').disabled = false;
        }

        function startGame() {
            if (!selectedCharacter) return;
            
            document.getElementById('characterSelection').style.display = 'none';
            document.getElementById('gameContent').style.display = 'block';
            
            updateStats();
            showScenario(0);
        }

        function updateStats() {
            const statsDiv = document.getElementById('stats');
            statsDiv.innerHTML = `
                <div class="stat">
                    <strong>Trust</strong><br>${gameState.trust}
                </div>
                <div class="stat">
                    <strong>Courage</strong><br>${gameState.courage}
                </div>
                <div class="stat">
                    <strong>Relationships</strong><br>${gameState.relationships}
                </div>
                <div class="stat">
                    <strong>Character</strong><br>${selectedCharacter}
                </div>
            `;
        }

        function showScenario(index) {
            if (index >= scenarios.length) {
                showEnding();
                return;
            }

            const scenario = scenarios[index];
            document.getElementById('scenario').innerHTML = `
                <h3>Scenario ${index + 1}</h3>
                <p>${scenario.text}</p>
            `;

            const choicesDiv = document.getElementById('choices');
            choicesDiv.innerHTML = '';

            scenario.choices.forEach((choice, choiceIndex) => {
                const button = document.createElement('button');
                button.className = 'choice-btn';
                button.textContent = choice.text;
                button.onclick = () => makeChoice(choice, index);
                choicesDiv.appendChild(button);
            });
        }

        function makeChoice(choice, scenarioIndex) {
            // Apply effects
            Object.entries(choice.effects).forEach(([stat, change]) => {
                gameState[stat] = Math.max(0, Math.min(100, gameState[stat] + change));
            });

            // Show choice result
            const resultText = getChoiceResult(choice, selectedCharacter);
            document.getElementById('scenario').innerHTML += `
                <div style="margin-top: 20px; padding: 15px; background: rgba(78, 205, 196, 0.2); border-radius: 10px;">
                    <strong>Your choice:</strong> ${choice.text}<br>
                    <strong>Result:</strong> ${resultText}
                </div>
            `;

            updateStats();

            // Move to next scenario after a delay
            setTimeout(() => {
                showScenario(scenarioIndex + 1);
            }, 2000);
        }

        function getChoiceResult(choice, character) {
            const characterInfo = characters[character];
            const results = [
                `Your ${characterInfo.element} powers ${choice.effects.courage > 0 ? 'flare with determination' : 'remain steady'}.`,
                `Others ${choice.effects.relationships > 0 ? 'appreciate your approach' : 'seem uncertain about your decision'}.`,
                `You feel ${choice.effects.trust > 0 ? 'more confident in your instincts' : 'some doubt creeping in'}.`
            ];
            return results[Math.floor(Math.random() * results.length)];
        }

        function showEnding() {
            let ending = "Your journey at the academy comes to a meaningful conclusion. ";
            
            if (gameState.trust > 70 && gameState.relationships > 70) {
                ending += "You've become a trusted leader who brings people together. Your friends know they can count on you, and you've learned that strength comes from connection.";
            } else if (gameState.courage > 70) {
                ending += "Your bold actions have made you a force to be reckoned with. You've learned that sometimes taking risks is the only way to protect what matters.";
            } else if (gameState.relationships > 70) {
                ending += "You've become the heart of your friend group. Your ability to understand and connect with others has created bonds that will last a lifetime.";
            } else {
                ending += "You've learned valuable lessons about balance. Not every situation requires the same approach, and wisdom comes from knowing when to be bold and when to be careful.";
            }

            document.getElementById('scenario').innerHTML = `
                <h3>Your Story Concludes</h3>
                <p>${ending}</p>
                <div style="text-align: center; margin-top: 20px;">
                    <button class="start-btn" onclick="location.reload()">Play Again</button>
                </div>
            `;
            
            document.getElementById('choices').innerHTML = '';
        }

        // Initialize the game
        populateCharacters();
    </script>
</body>
</html>
