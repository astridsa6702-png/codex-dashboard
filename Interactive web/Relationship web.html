<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Relationship Web</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            overflow: hidden;
        }
        
        #container {
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        
        #controls {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 1000;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
        }
        
        #legend {
            position: absolute;
            top: 10px;
            left: 10px;
            z-index: 1000;
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(10px);
            max-width: 200px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
        }
        
        .legend-line {
            width: 20px;
            height: 3px;
            margin-right: 10px;
            border-radius: 2px;
        }
        
        #canvas {
            flex: 1;
            background: radial-gradient(ellipse at center, rgba(255,255,255,0.1) 0%, transparent 70%);
        }
        
        .character-node {
            position: absolute;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 3px solid rgba(255,255,255,0.3);
            backdrop-filter: blur(5px);
            font-size: 10px;
            text-align: center;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .character-node:hover {
            transform: scale(1.2);
            border-color: rgba(255,255,255,0.8);
            box-shadow: 0 6px 25px rgba(0,0,0,0.5);
        }
        
        .character-node.selected {
            border-color: #ffff00;
            box-shadow: 0 0 20px rgba(255,255,0,0.6);
        }
        
        .relationship-line {
            position: absolute;
            transform-origin: 0 50%;
            height: 3px;
            border-radius: 2px;
            transition: all 0.3s ease;
            opacity: 0.7;
        }
        
        .relationship-line:hover {
            height: 5px;
            opacity: 1;
        }
        
        .romantic { background: #fa12c8; }
        .familial { background: #489bf3; }
        .rivalry { background: #fc0303; }
        .mentorship { background: #9c27b0; }
        .friendly-rivalry { background: #f2dd1e; }
        .one-sided-rivalry { background: #f57710; }
        .complicated-rivalry { background: #653b2c; }
        .platonic { background: #6af2d2; }
        .wary { background: #C0C0C0; }
        .suspicious { background: #808080  ; }
        
        
        button {
            background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            padding: 8px 12px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            backdrop-filter: blur(5px);
            transition: all 0.3s ease;
        }
        
        button:hover {
            background: rgba(255,255,255,0.3);
            border-color: rgba(255,255,255,0.5);
        }
        
        h3 {
            margin: 0 0 10px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="legend">
            <h3>Relationship Types</h3>
            <div class="legend-item">
                <div class="legend-line romantic"></div>
                <span>Romantic Potential</span>
            </div>
            <div class="legend-item">
                <div class="legend-line familial"></div>
                <span>Familial Bond</span>
            </div>
            <div class="legend-item">
                <div class="legend-line rivalry"></div>
                <span>Strong Rivalry</span>
            </div>
            <div class="legend-item">
                <div class="legend-line friendly-rivalry"></div>
                <span>Friendly Rivalry</span>
            </div>
            <div class="legend-item">
                <div class="legend-line one-sided-rivalry"></div>
                <span>One-sided Rivalry</span>
            </div>
            <div class="legend-item">
                <div class="legend-line complicated-rivalry"></div>
                <span>Complicated</span>
            </div>
            <div class="legend-item">
                <div class="legend-line mentorship"></div>
                <span>Mentorship</span>
            </div>
            <div class="legend-item">
                <div class="legend-line platonic"></div>
                <span>Platonic</span>
            </div>
            <div class="legend-item">
                <div class="legend-line wary"></div>
                <span>Wary</span>
            </div>
            <div class="legend-item">
                <div class="legend-line suspicious"></div>
                <span>Suspicious</span>
            </div>
        </div>
        
        <div id="controls">
            <h3>Controls</h3>
            <button onclick="showOnlyType('romantic')">Romantic</button>
            <button onclick="showOnlyType('familial')">Familial</button>
            <button onclick="showOnlyType('rivalry')">Rivalries</button>
            <button onclick="showOnlyType('mentorship')">Mentorship</button>
            <button onclick="showOnlyType('platonic')">Platonic</button>
            <button onclick="showOnlyType('wary')">Wary</button>
            <button onclick="showOnlyType('suspicious')">Suspicious</button>
            <button onclick="toggleAllLines()">Toggle All</button>
            <button onclick="resetPositions()">Reset</button>
        </div>
        
        <div id="canvas"></div>
    </div>

    <script>
        const characters = [
            { name: "Liam Reed", color: "#740001", element: "Fire", x: 0.5, y: 0.3 },
            { name: "Rowan Khanna", color: "#740001", element: "Sound", x: 0.4, y: 0.2 },
            { name: "Ben Copper", color: "#740001", element: "Earth", x: 0.6, y: 0.2 },
            { name: "Jae Kim", color: "#740001", element: "Air", x: 0.3, y: 0.4 },
            { name: "Penny Haywood", color: "#ecb939", element: "Light", x: 0.7, y: 0.4 },
            { name: "Mayumi Sasaki", color: "#ecb939", element: "Nature", x: 0.8, y: 0.5 },
            { name: "Chiara Lobosca", color: "#ecb939", element: "Water", x: 0.7, y: 0.6 },
            { name: "Tulip Karasu", color: "#222f5b", element: "Poison", x: 0.3, y: 0.6 },
            { name: "Hayami Amamiya", color: "#222f5b", element: "Lightning", x: 0.2, y: 0.7 },
            { name: "Talbott Winger", color: "#222f5b", element: "Ice", x: 0.4, y: 0.8 },
            { name: "Andre Egwu", color: "#222f5b", element: "Crystal", x: 0.6, y: 0.8 },
            { name: "Barnaby Lee", color: "#1a472a", element: "Metal", x: 0.8, y: 0.3 },
            { name: "Merula Snyde", color: "#1a472a", element: "Shadow", x: 0.5, y: 0.5 }
        ];

        const relationships = [
            // Romantic Potential
            { from: 0, to: 1, type: "romantic" }, // Liam & Rowan
            { from: 0, to: 12, type: "romantic" }, // Liam & Merula
            { from: 1, to: 2, type: "romantic" }, // Rowan & Ben
            { from: 2, to: 11, type: "romantic" }, // Ben & Barnaby
            { from: 4, to: 5, type: "romantic" }, // Penny & Mayumi
            { from: 4, to: 11, type: "romantic" }, // Penny & Barnaby
            { from: 5, to: 6, type: "romantic" }, // Mayumi & Chiara
            { from: 7, to: 8, type: "romantic" }, // Tulip & Hayami
            { from: 9, to: 10, type: "romantic" }, // Talbott & Andre
            
            // Familial Bonds
            { from: 0, to: 1, type: "familial" }, // Liam & Rowan
            { from: 0, to: 2, type: "familial" }, // Liam & Ben
            { from: 0, to: 3, type: "familial" }, // Liam & Jae
            { from: 1, to: 2, type: "familial" }, // Rowan & Ben
            { from: 1, to: 3, type: "familial" }, // Rowan & Jae
            { from: 2, to: 3, type: "familial" }, // Ben & Jae
            { from: 4, to: 5, type: "familial" }, // Penny & Mayumi
            { from: 4, to: 6, type: "familial" }, // Penny & Chiara
            { from: 5, to: 6, type: "familial" }, // Mayumi & Chiara
            { from: 7, to: 8, type: "familial" }, // Tulip & Hayami
            { from: 7, to: 9, type: "familial" }, // Tulip & Talbott
            { from: 7, to: 10, type: "familial" }, // Tulip & Andre
            { from: 8, to: 9, type: "familial" }, // Hayami & Talbott
            { from: 8, to: 10, type: "familial" }, // Hayami & Andre
            { from: 9, to: 10, type: "familial" }, // Talbott & Andre
            
            // Rivalries
            { from: 0, to: 12, type: "rivalry" }, // Liam & Merula (strong)
            { from: 7, to: 8, type: "friendly-rivalry" }, // Tulip & Hayami (friendly)
            { from: 1, to: 9, type: "friendly-rivalry" }, // Rowan & Talbott (friendly)
            { from: 12, to: 8, type: "one-sided-rivalry" }, // Merula vs Hayami (one-sided)
            { from: 12, to: 9, type: "one-sided-rivalry" }, // Merula vs Talbott (one-sided)
            { from: 12, to: 7, type: "complicated-rivalry" }, // Merula & Tulip (complicated)
            
            // Mentorship
            { from: 8, to: 0, type: "mentorship" }, // Hayami mentors Liam
            { from: 9, to: 0, type: "mentorship" }, // Talbott mentors Liam
            { from: 6, to: 11, type: "mentorship" }, // Chiara mentors Barnaby

            //Platonic
            { from: 0, to: 4, type: "platonic" }, // Liam & Penny
            { from: 0, to: 5, type: "platonic" }, // Liam & Mayumi
            { from: 0, to: 6, type: "platonic" }, // Liam & Chiara
            { from: 0, to: 7, type: "platonic" }, // Liam & Tulip
            { from: 0, to: 8, type: "platonic" }, // Liam & Hayami
            { from: 0, to: 9, type: "platonic" }, // Liam & Talbott
            { from: 0, to: 10, type: "platonic" }, // Liam & Andre
            { from: 0, to: 11, type: "platonic" }, // Liam & Barnaby
            { from: 1, to: 4, type: "platonic" }, // Rowan & Penny
            { from: 1, to: 5, type: "platonic" }, // Rowan & Mayumi
            { from: 1, to: 6, type: "platonic" }, // Rowan & Chiara
            { from: 1, to: 7, type: "platonic" }, // Rowan & Tulip
            { from: 1, to: 8, type: "platonic" }, // Rowan & Hayami
            { from: 1, to: 9, type: "platonic" }, // Rowan & Talbott
            { from: 1, to: 10, type: "platonic" }, // Rowan & Andre
            { from: 1, to: 11, type: "platonic" }, // Rowan & Barnaby
            { from: 2, to: 4, type: "platonic" }, // Ben & Penny
            { from: 2, to: 5, type: "platonic" }, // Ben & Mayumi
            { from: 2, to: 6, type: "platonic" }, // Ben & Chiara
            { from: 2, to: 7, type: "platonic" }, // Ben & Tulip
            { from: 2, to: 8, type: "platonic" }, // Ben & Hayami
            { from: 2, to: 9, type: "platonic" }, // Ben & Talbott
            { from: 2, to: 10, type: "platonic" }, // Ben & Andre
            { from: 3, to: 4, type: "platonic" }, // Jae & Penny
            { from: 3, to: 5, type: "platonic" }, // Jae & Mayumi
            { from: 3, to: 6, type: "platonic" }, // Jae & Chiara
            { from: 3, to: 7, type: "platonic" }, // Jae & Tulip
            { from: 3, to: 8, type: "platonic" }, // Jae & Hayami
            { from: 3, to: 9, type: "platonic" }, // Jae & Talbott
            { from: 3, to: 10, type: "platonic" }, // Jae & Andre
            { from: 3, to: 11, type: "platonic" }, // Jae & Barnaby
            { from: 4, to: 7, type: "platonic" }, // Penny & Tulip
            { from: 4, to: 8, type: "platonic" }, // Penny & Hayami
            { from: 4, to: 9, type: "platonic" }, // Penny & Talbott
            { from: 4, to: 10, type: "platonic" }, // Penny & Andre
            { from: 5, to: 7, type: "platonic" }, // Mayumi & Tulip
            { from: 5, to: 8, type: "platonic" }, // Mayumi & Hayami
            { from: 5, to: 9, type: "platonic" }, // Mayumi & Talbott
            { from: 5, to: 10, type: "platonic" }, // Mayumi & Andre
            { from: 5, to: 11, type: "platonic" }, // Mayumi & Barnaby
            { from: 6, to: 7, type: "platonic" }, // Chiara & Tulip
            { from: 6, to: 8, type: "platonic" }, // Chiara & Hayami
            { from: 6, to: 9, type: "platonic" }, // Chiara & Talbott
            { from: 6, to: 10, type: "platonic" }, // Chiara & Andre
            { from: 6, to: 11, type: "platonic" }, // Chiara & Barnaby
            { from: 7, to: 11, type: "platonic" }, // Tulip & Barnaby
            { from: 8, to: 11, type: "platonic" }, // Hayami & Barnaby
            { from: 9, to: 11, type: "platonic" }, // Talbott & Barnaby
            { from: 10, to: 11, type: "platonic" }, // Andre & Barnaby

            //Wary
            { from: 12, to: 1, type: "wary" }, // Merula & Rowan
            { from: 12, to: 3, type: "wary" }, // Merula & Jae
            { from: 12, to: 4, type: "wary" }, // Merula & Penny
            { from: 12, to: 10, type: "wary" }, // Merula & Andre
            { from: 12, to: 11, type: "wary" }, // Merula & Barnaby

            //suspicious
            { from: 12, to: 2, type: "suspicious" }, // Merula & Ben
            { from: 12, to: 5, type: "suspicious" }, // Merula & Mayumi
            { from: 12, to: 6, type: "suspicious" }, // Merula & Chiara
            { from: 12, to: 8, type: "suspicious" }, // Merula & Hayami
            { from: 12, to: 9, type: "suspicious" }, // Merula & Talbott
        ];

        let canvas = document.getElementById('canvas');
        let showLines = true;
        let selectedCharacter = null;
        let currentFilter = 'all';

        function createCharacterNodes() {
            characters.forEach((char, index) => {
                let node = document.createElement('div');
                node.className = 'character-node';
                node.style.backgroundColor = char.color;
                node.style.left = (char.x * (window.innerWidth - 100)) + 'px';
                node.style.top = (char.y * (window.innerHeight - 100)) + 'px';
                node.innerHTML = char.name.split(' ')[0] + '<br>' + char.name.split(' ')[1];
                node.dataset.index = index;
                node.onclick = () => selectCharacter(index);
                
                // Make draggable
                node.onmousedown = (e) => startDrag(e, index);
                
                canvas.appendChild(node);
            });
        }

        function createRelationshipLines() {
            relationships.forEach((rel, index) => {
                let line = document.createElement('div');
                line.className = `relationship-line ${rel.type}`;
                line.dataset.relIndex = index;
                
                updateLinePosition(line, rel.from, rel.to);
                
                canvas.appendChild(line);
            });
        }

        function updateLinePosition(line, fromIndex, toIndex) {
            let fromChar = characters[fromIndex];
            let toChar = characters[toIndex];
            
            let fromX = fromChar.x * (window.innerWidth - 100) + 40;
            let fromY = fromChar.y * (window.innerHeight - 100) + 40;
            let toX = toChar.x * (window.innerWidth - 100) + 40;
            let toY = toChar.y * (window.innerHeight - 100) + 40;
            
            let distance = Math.sqrt((toX - fromX) ** 2 + (toY - fromY) ** 2);
            let angle = Math.atan2(toY - fromY, toX - fromX) * 180 / Math.PI;
            
            line.style.left = fromX + 'px';
            line.style.top = fromY + 'px';
            line.style.width = distance + 'px';
            line.style.transform = `rotate(${angle}deg)`;
        }

        function updateAllLines() {
            let lines = document.querySelectorAll('.relationship-line');
            lines.forEach((line, index) => {
                let rel = relationships[index];
                updateLinePosition(line, rel.from, rel.to);
            });
        }

        function selectCharacter(index) {
            // Remove previous selection
            document.querySelectorAll('.character-node').forEach(node => {
                node.classList.remove('selected');
            });
            
            // Select new character
            let node = document.querySelector(`[data-index="${index}"]`);
            node.classList.add('selected');
            selectedCharacter = index;
            
            // Highlight related connections
            highlightConnections(index);
        }

        function highlightConnections(charIndex) {
            let lines = document.querySelectorAll('.relationship-line');
            lines.forEach((line, index) => {
                let rel = relationships[index];
                if (rel.from === charIndex || rel.to === charIndex) {
                    line.style.opacity = '1';
                    line.style.height = '5px';
                } else {
                    line.style.opacity = '0.2';
                    line.style.height = '2px';
                }
            });
        }

        function showOnlyType(type) {
            let lines = document.querySelectorAll('.relationship-line');
            currentFilter = type;
            
            lines.forEach(line => {
                if (type === 'rivalry') {
                    // Show all rivalry types
                    if (line.classList.contains('rivalry') || 
                        line.classList.contains('friendly-rivalry') || 
                        line.classList.contains('one-sided-rivalry') || 
                        line.classList.contains('complicated-rivalry')) {
                        line.style.display = 'block';
                        line.style.opacity = '1';
                    } else {
                        line.style.display = 'none';
                    }
                } else if (line.classList.contains(type)) {
                    line.style.display = 'block';
                    line.style.opacity = '1';
                } else {
                    line.style.display = 'none';
                }
            });
        }

        function toggleAllLines() {
            showLines = !showLines;
            let lines = document.querySelectorAll('.relationship-line');
            lines.forEach(line => {
                line.style.display = showLines ? 'block' : 'none';
                line.style.opacity = showLines ? '0.7' : '0';
            });
            currentFilter = showLines ? 'all' : 'none';
        }

        function resetPositions() {
            characters.forEach((char, index) => {
                let node = document.querySelector(`[data-index="${index}"]`);
                node.style.left = (char.x * (window.innerWidth - 100)) + 'px';
                node.style.top = (char.y * (window.innerHeight - 100)) + 'px';
            });
            updateAllLines();
        }

        // Drag functionality
        let dragState = { isDragging: false, charIndex: -1, offsetX: 0, offsetY: 0 };

        function startDrag(e, charIndex) {
            dragState.isDragging = true;
            dragState.charIndex = charIndex;
            let node = document.querySelector(`[data-index="${charIndex}"]`);
            let rect = node.getBoundingClientRect();
            dragState.offsetX = e.clientX - rect.left;
            dragState.offsetY = e.clientY - rect.top;
            e.preventDefault();
        }

        document.onmousemove = function(e) {
            if (dragState.isDragging) {
                let newX = (e.clientX - dragState.offsetX) / (window.innerWidth - 100);
                let newY = (e.clientY - dragState.offsetY) / (window.innerHeight - 100);
                
                newX = Math.max(0, Math.min(1, newX));
                newY = Math.max(0, Math.min(1, newY));
                
                characters[dragState.charIndex].x = newX;
                characters[dragState.charIndex].y = newY;
                
                let node = document.querySelector(`[data-index="${dragState.charIndex}"]`);
                node.style.left = (newX * (window.innerWidth - 100)) + 'px';
                node.style.top = (newY * (window.innerHeight - 100)) + 'px';
                
                updateAllLines();
            }
        };

        document.onmouseup = function() {
            dragState.isDragging = false;
        };

        // Initialize
        createCharacterNodes();
        createRelationshipLines();

        // Handle window resize
        window.onresize = function() {
            resetPositions();
        };
    </script>
</body>
</html>
