<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elemental Abilities Showcase</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: white;
            min-height: 100vh;
            overflow-x: auto;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1, #96ceb4);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: rainbow 3s ease-in-out infinite alternate;
        }

        .subtitle {
            text-align: center;
            margin-bottom: 40px;
            opacity: 0.8;
            font-size: 1.1rem;
        }

        .characters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .character-card {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .character-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .character-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .character-name {
            font-size: 1.3rem;
            font-weight: bold;
        }

        .character-pronouns {
            opacity: 0.7;
            font-size: 0.9rem;
        }

        .ability-name {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .ability-description {
            opacity: 0.8;
            line-height: 1.4;
            margin-bottom: 15px;
        }

        .demo-button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Ability-specific styling */
        .fire { border-left: 4px solid #ff4757; }
        .fire .demo-button { background: linear-gradient(45deg, #ff4757, #ff6b6b); color: white; }
        .fire .demo-button:hover { background: linear-gradient(45deg, #ff3742, #ff5252); transform: scale(1.05); }

        .sound { border-left: 4px solid #3742fa; }
        .sound .demo-button { background: linear-gradient(45deg, #3742fa, #5352ed); color: white; }
        .sound .demo-button:hover { background: linear-gradient(45deg, #2f3542, #40407a); transform: scale(1.05); }

        .earth { border-left: 4px solid #8b4513; }
        .earth .demo-button { background: linear-gradient(45deg, #8b4513, #a0522d); color: white; }
        .earth .demo-button:hover { background: linear-gradient(45deg, #654321, #8b4513); transform: scale(1.05); }

        .air { border-left: 4px solid #00d2d3; }
        .air .demo-button { background: linear-gradient(45deg, #00d2d3, #54a0ff); color: white; }
        .air .demo-button:hover { background: linear-gradient(45deg, #00a8cc, #2f80ed); transform: scale(1.05); }

        .light { border-left: 4px solid #ffd700; }
        .light .demo-button { background: linear-gradient(45deg, #ffd700, #ffed4e); color: #333; }
        .light .demo-button:hover { background: linear-gradient(45deg, #ffcc02, #ffda79); transform: scale(1.05); }

        .nature { border-left: 4px solid #2ed573; }
        .nature .demo-button { background: linear-gradient(45deg, #2ed573, #7bed9f); color: white; }
        .nature .demo-button:hover { background: linear-gradient(45deg, #26de81, #5f27cd); transform: scale(1.05); }

        .water { border-left: 4px solid #0984e3; }
        .water .demo-button { background: linear-gradient(45deg, #0984e3, #74b9ff); color: white; }
        .water .demo-button:hover { background: linear-gradient(45deg, #0770d1, #6c5ce7); transform: scale(1.05); }

        .poison { border-left: 4px solid #6c5ce7; }
        .poison .demo-button { background: linear-gradient(45deg, #6c5ce7, #a29bfe); color: white; }
        .poison .demo-button:hover { background: linear-gradient(45deg, #5f3dc4, #7c4dff); transform: scale(1.05); }

        .lightning { border-left: 4px solid #f39c12; }
        .lightning .demo-button { background: linear-gradient(45deg, #f39c12, #f1c40f); color: white; }
        .lightning .demo-button:hover { background: linear-gradient(45deg, #e67e22, #f4d03f); transform: scale(1.05); }

        .ice { border-left: 4px solid #00cec9; }
        .ice .demo-button { background: linear-gradient(45deg, #00cec9, #81ecec); color: white; }
        .ice .demo-button:hover { background: linear-gradient(45deg, #00b894, #55efc4); transform: scale(1.05); }

        .crystal { border-left: 4px solid #e17055; }
        .crystal .demo-button { background: linear-gradient(45deg, #e17055, #fab1a0); color: white; }
        .crystal .demo-button:hover { background: linear-gradient(45deg, #d63031, #fd79a8); transform: scale(1.05); }

        .metal { border-left: 4px solid #636e72; }
        .metal .demo-button { background: linear-gradient(45deg, #636e72, #b2bec3); color: white; }
        .metal .demo-button:hover { background: linear-gradient(45deg, #2d3436, #74b9ff); transform: scale(1.05); }

        .shadow { border-left: 4px solid #2d3436; }
        .shadow .demo-button { background: linear-gradient(45deg, #2d3436, #636e72); color: white; }
        .shadow .demo-button:hover { background: linear-gradient(45deg, #000, #2d3436); transform: scale(1.05); }

        /* Effect overlay */
        .effect-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
        }

        /* Animation keyframes */
        @keyframes rainbow {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }

        @keyframes shake {
            0%, 100% { transform: translate(0); }
            25% { transform: translate(-2px, -2px); }
            50% { transform: translate(2px, -2px); }
            75% { transform: translate(-2px, 2px); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.1); opacity: 0.8; }
        }

        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 215, 0, 0.5); }
            50% { box-shadow: 0 0 40px rgba(255, 215, 0, 0.8); }
        }

        .instructions {
            text-align: center;
            margin-top: 30px;
            opacity: 0.7;
            font-style: italic;
        }

        /* Particle effects */
        .particle {
            position: absolute;
            pointer-events: none;
            border-radius: 50%;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .characters-grid {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Elemental Abilities Showcase</h1>
        <p class="subtitle">Click on any character's ability to see their elemental power in action!</p>
        
        <div class="characters-grid" id="charactersGrid">
            <!-- Characters will be populated by JavaScript -->
        </div>
        
        <p class="instructions">Each character has unique elemental abilities. Click the demo buttons to experience their powers!</p>
    </div>
    
    <div class="effect-overlay" id="effectOverlay"></div>

    <script>
        const characters = [
            {
                name: "Liam Reed",
                pronouns: "he/they",
                ability: "Fire",
                description: "Classic and chaotic. Burn it all or warm your hands. Your choice.",
                class: "fire"
            },
            {
                name: "Rowan Khanna",
                pronouns: "they/them",
                ability: "Sound",
                description: "Sonic booms, vibration waves, and the power to shatter eardrums and glass.",
                class: "sound"
            },
            {
                name: "Ben Copper",
                pronouns: "he/they",
                ability: "Earth",
                description: "Grounded power. Boulders, armor, and earthquakes included.",
                class: "earth"
            },
            {
                name: "Jae Kim",
                pronouns: "he/him",
                ability: "Wind/Air",
                description: "Slicing gusts, flight, and casually flipping tables without lifting a finger.",
                class: "air"
            },
            {
                name: "Penny Haywood",
                pronouns: "she/her",
                ability: "Light",
                description: "Blinding flashes, lasers, illusions, and holy judgment vibes.",
                class: "light"
            },
            {
                name: "Mayumi Sasaki",
                pronouns: "she/her",
                ability: "Nature",
                description: "Vines, thorns, and plants that aren't vegan-friendly.",
                class: "nature"
            },
            {
                name: "Chiara Lobosca",
                pronouns: "she/her",
                ability: "Water",
                description: "From gentle healing to crushing tidal waves. Hydration and devastation.",
                class: "water"
            },
            {
                name: "Tulip Karasu",
                pronouns: "she/her",
                ability: "Poison",
                description: "Venomous strikes, acidic blasts, and toxic clouds. Bad breath weaponized.",
                class: "poison"
            },
            {
                name: "Hayami Amamiya",
                pronouns: "she/they",
                ability: "Lightning",
                description: "Fast, furious, shocking, and destructive. Zeus would approve.",
                class: "lightning"
            },
            {
                name: "Talbott Winger",
                pronouns: "he/him",
                ability: "Ice",
                description: "Cool under pressure. Freeze enemies, slide into battle, Elsa-style.",
                class: "ice"
            },
            {
                name: "Andre Egwu",
                pronouns: "he/they",
                ability: "Crystal",
                description: "Shards, prisms, armor, and reflect magic like a disco ball of doom.",
                class: "crystal"
            },
            {
                name: "Barnaby Lee",
                pronouns: "he/him",
                ability: "Metal",
                description: "Control steel, bend weapons, or just become a walking tank.",
                class: "metal"
            },
            {
                name: "Merula Snyde",
                pronouns: "she/her",
                ability: "Shadow",
                description: "Cloak yourself in fear, teleport through shadows, or just brood in the corner.",
                class: "shadow"
            }
        ];

        function createCharacterCard(character) {
            return `
                <div class="character-card ${character.class}">
                    <div class="character-header">
                        <div class="character-name">${character.name}</div>
                        <div class="character-pronouns">${character.pronouns}</div>
                    </div>
                    <div class="ability-name">
                        ${character.ability}
                    </div>
                    <div class="ability-description">${character.description}</div>
                    <button class="demo-button" onclick="demonstrateAbility('${character.class}', '${character.ability}')">
                        Demonstrate ${character.ability}
                    </button>
                </div>
            `;
        }

        function createParticle(x, y, color, size = 5) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = x + 'px';
            particle.style.top = y + 'px';
            particle.style.width = size + 'px';
            particle.style.height = size + 'px';
            particle.style.backgroundColor = color;
            
            const overlay = document.getElementById('effectOverlay');
            overlay.appendChild(particle);
            
            // Animate particle
            const angle = Math.random() * Math.PI * 2;
            const velocity = Math.random() * 200 + 100;
            const vx = Math.cos(angle) * velocity;
            const vy = Math.sin(angle) * velocity;
            
            let px = x, py = y;
            let life = 1;
            
            const animate = () => {
                px += vx * 0.016;
                py += vy * 0.016;
                life -= 0.02;
                
                particle.style.left = px + 'px';
                particle.style.top = py + 'px';
                particle.style.opacity = life;
                
                if (life > 0) {
                    requestAnimationFrame(animate);
                } else {
                    particle.remove();
                }
            };
            
            animate();
        }

        function demonstrateAbility(type, abilityName) {
            const overlay = document.getElementById('effectOverlay');
            
            // Clear previous effects
            overlay.innerHTML = '';
            
            switch(type) {
                case 'fire':
                    // Fire particles
                    for (let i = 0; i < 50; i++) {
                        setTimeout(() => {
                            const x = Math.random() * window.innerWidth;
                            const y = Math.random() * window.innerHeight;
                            const colors = ['#ff4757', '#ff6b6b', '#ff9ff3', '#ffa502'];
                            createParticle(x, y, colors[Math.floor(Math.random() * colors.length)], Math.random() * 10 + 5);
                        }, i * 20);
                    }
                    document.body.style.background = 'linear-gradient(135deg, #ff4757, #ff6b6b, #ffa502)';
                    break;
                    
                case 'sound':
                    // Sound waves
                    document.body.style.animation = 'shake 0.5s infinite';
                    for (let i = 0; i < 5; i++) {
                        setTimeout(() => {
                            const wave = document.createElement('div');
                            wave.style.cssText = `
                                position: fixed;
                                top: 50%;
                                left: 50%;
                                width: ${i * 200}px;
                                height: ${i * 200}px;
                                border: 3px solid #3742fa;
                                border-radius: 50%;
                                transform: translate(-50%, -50%);
                                opacity: ${1 - i * 0.2};
                                pointer-events: none;
                                animation: pulse 1s ease-out forwards;
                            `;
                            overlay.appendChild(wave);
                            setTimeout(() => wave.remove(), 1000);
                        }, i * 200);
                    }
                    break;
                    
                case 'earth':
                    // Earthquake effect
                    document.body.style.animation = 'shake 2s infinite';
                    for (let i = 0; i < 30; i++) {
                        setTimeout(() => {
                            const x = Math.random() * window.innerWidth;
                            const y = window.innerHeight - Math.random() * 100;
                            createParticle(x, y, '#8b4513', Math.random() * 15 + 10);
                        }, i * 50);
                    }
                    document.body.style.background = 'linear-gradient(135deg, #8b4513, #a0522d, #654321)';
                    break;
                    
                case 'air':
                    // Wind effect
                    const cards = document.querySelectorAll('.character-card');
                    cards.forEach(card => {
                        card.style.animation = 'float 2s ease-in-out infinite';
                    });
                    for (let i = 0; i < 40; i++) {
                        setTimeout(() => {
                            const x = Math.random() * window.innerWidth;
                            const y = Math.random() * window.innerHeight;
                            createParticle(x, y, '#00d2d3', Math.random() * 8 + 3);
                        }, i * 30);
                    }
                    document.body.style.background = 'linear-gradient(135deg, #00d2d3, #54a0ff, #74b9ff)';
                    break;
                    
                case 'light':
                    // Blinding flash
                    overlay.style.background = 'rgba(255, 255, 255, 0.9)';
                    overlay.style.animation = 'glow 1s ease-in-out';
                    setTimeout(() => {
                        overlay.style.background = 'transparent';
                        overlay.style.animation = '';
                    }, 1000);
                    
                    // Light rays
                    for (let i = 0; i < 8; i++) {
                        const ray = document.createElement('div');
                        ray.style.cssText = `
                            position: fixed;
                            top: 50%;
                            left: 50%;
                            width: 2px;
                            height: 50vh;
                            background: linear-gradient(to bottom, #ffd700, transparent);
                            transform: translate(-50%, -50%) rotate(${i * 45}deg);
                            transform-origin: center top;
                            animation: pulse 2s ease-in-out infinite;
                        `;
                        overlay.appendChild(ray);
                        setTimeout(() => ray.remove(), 2000);
                    }
                    break;
                    
                case 'nature':
                    // Growing vines
                    document.body.style.background = 'linear-gradient(135deg, #2ed573, #7bed9f, #26de81)';
                    for (let i = 0; i < 20; i++) {
                        setTimeout(() => {
                            const x = Math.random() * window.innerWidth;
                            const y = window.innerHeight;
                            const vine = document.createElement('div');
                            vine.style.cssText = `
                                position: fixed;
                                left: ${x}px;
                                bottom: 0;
                                width: 5px;
                                height: 0;
                                background: linear-gradient(to top, #2ed573, #7bed9f);
                                animation: grow 2s ease-out forwards;
                            `;
                            overlay.appendChild(vine);
                            setTimeout(() => vine.remove(), 2000);
                        }, i * 100);
                    }
                    break;
                    
                case 'water':
                    // Wave effect
                    document.body.style.background = 'linear-gradient(135deg, #0984e3, #74b9ff, #00cec9)';
                    for (let i = 0; i < 3; i++) {
                        const wave = document.createElement('div');
                        wave.style.cssText = `
                            position: fixed;
                            bottom: ${i * -50}px;
                            left: 0;
                            width: 100%;
                            height: 100px;
                            background: rgba(116, 185, 255, 0.3);
                            border-radius: 50% 50% 0 0;
                            animation: wave 3s ease-in-out infinite;
                            animation-delay: ${i * 0.5}s;
                        `;
                        overlay.appendChild(wave);
                        setTimeout(() => wave.remove(), 3000);
                    }
                    break;
                    
                case 'poison':
                    // Toxic cloud
                    document.body.style.background = 'linear-gradient(135deg, #6c5ce7, #a29bfe, #5f3dc4)';
                    for (let i = 0; i < 25; i++) {
                        setTimeout(() => {
                            const x = Math.random() * window.innerWidth;
                            const y = Math.random() * window.innerHeight;
                            const cloud = document.createElement('div');
                            cloud.style.cssText = `
                                position: fixed;
                                left: ${x}px;
                                top: ${y}px;
                                width: 50px;
                                height: 50px;
                                background: radial-gradient(circle, rgba(108, 92, 231, 0.6), transparent);
                                border-radius: 50%;
                                animation: float 3s ease-in-out infinite;
                            `;
                            overlay.appendChild(cloud);
                            setTimeout(() => cloud.remove(), 3000);
                        }, i * 100);
                    }
                    break;
                    
                case 'lightning':
                    // Lightning bolts
                    document.body.style.background = 'linear-gradient(135deg, #f39c12, #f1c40f, #e67e22)';
                    for (let i = 0; i < 5; i++) {
                        setTimeout(() => {
                            const bolt = document.createElement('div');
                            const x = Math.random() * window.innerWidth;
                            bolt.style.cssText = `
                                position: fixed;
                                left: ${x}px;
                                top: 0;
                                width: 3px;
                                height: 100vh;
                                background: linear-gradient(to bottom, #f39c12, #f1c40f);
                                box-shadow: 0 0 20px #f39c12;
                                animation: flash 0.1s ease-in-out;
                            `;
                            overlay.appendChild(bolt);
                            setTimeout(() => bolt.remove(), 100);
                        }, i * 300);
                    }
                    break;
                    
                case 'ice':
                    // Ice crystals
                    document.body.style.background = 'linear-gradient(135deg, #00cec9, #81ecec, #00b894)';
                    for (let i = 0; i < 30; i++) {
                        setTimeout(() => {
                            const x = Math.random() * window.innerWidth;
                            const y = Math.random() * window.innerHeight;
                            const crystal = document.createElement('div');
                            crystal.style.cssText = `
                                position: fixed;
                                left: ${x}px;
                                top: ${y}px;
                                width: 20px;
                                height: 20px;
                                background: #81ecec;
                                transform: rotate(45deg);
                                box-shadow: 0 0 10px #00cec9;
                                animation: float 2s ease-in-out infinite;
                            `;
                            overlay.appendChild(crystal);
                            setTimeout(() => crystal.remove(), 2000);
                        }, i * 80);
                    }
                    break;
                    
                case 'crystal':
                    // Crystal prisms
                    document.body.style.background = 'linear-gradient(135deg, #e17055, #fab1a0, #fd79a8)';
                    for (let i = 0; i < 15; i++) {
                        setTimeout(() => {
                            const x = Math.random() * window.innerWidth;
                            const y = Math.random() * window.innerHeight;
                            const prism = document.createElement('div');
                            prism.style.cssText = `
                                position: fixed;
                                left: ${x}px;
                                top: ${y}px;
                                width: 30px;
                                height: 30px;
                                background: linear-gradient(45deg, #e17055, #fab1a0, #fd79a8);
                                clip-path: polygon(50% 0%, 0% 100%, 100% 100%);
                                animation: pulse 2s ease-in-out infinite;
                            `;
                            overlay.appendChild(prism);
                            setTimeout(() => prism.remove(), 2000);
                        }, i * 150);
                    }
                    break;
                    
                case 'metal':
                    // Metal sparks
                    document.body.style.background = 'linear-gradient(135deg, #636e72, #b2bec3, #74b9ff)';
                    for (let i = 0; i < 40; i++) {
                        setTimeout(() => {
                            const x = Math.random() * window.innerWidth;
                            const y = Math.random() * window.innerHeight;
                            createParticle(x, y, '#b2bec3', Math.random() * 5 + 2);
                        }, i * 25);
                    }
                    break;
                    
                case 'shadow':
                    // Shadow tendrils
                    document.body.style.background = 'linear-gradient(135deg, #2d3436, #636e72, #000)';
                    for (let i = 0; i < 8; i++) {
                        setTimeout(() => {
                            const tendril = document.createElement('div');
                            const x = Math.random() * window.innerWidth;
                            tendril.style.cssText = `
                                position: fixed;
                                left: ${x}px;
                                bottom: 0;
                                width: 20px;
                                height: 0;
                                background: linear-gradient(to top, #2d3436, transparent);
                                border-radius: 10px;
                                animation: grow 3s ease-out forwards;
                            `;
                            overlay.appendChild(tendril);
                            setTimeout(() => tendril.remove(), 3000);
                        }, i * 200);
                    }
                    break;
            }
            
            // Reset after 3 seconds
            setTimeout(() => {
                document.body.style.background = 'linear-gradient(135deg, #1a1a2e, #16213e, #0f3460)';
                document.body.style.animation = '';
                const cards = document.querySelectorAll('.character-card');
                cards.forEach(card => {
                    card.style.animation = '';
                });
                overlay.innerHTML = '';
            }, 3000);
        }

        // Add CSS animations dynamically
        const style = document.createElement('style');
        style.textContent = `
            @keyframes grow {
                from { height: 0; }
                to { height: 300px; }
            }
            
            @keyframes wave {
                0%, 100% { transform: translateY(0); }
                50% { transform: translateY(-50px); }
            }
            
            @keyframes flash {
                0%, 100% { opacity: 0; }
                50% { opacity: 1; }
            }
        `;
        document.head.appendChild(style);

        // Populate characters
        document.getElementById('charactersGrid').innerHTML = 
            characters.map(createCharacterCard).join('');
    </script>
</body>
</html>
