<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Element Battle Simulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .battle-setup {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            gap: 30px;
            margin-bottom: 30px;
            align-items: center;
        }

        .fighter-selection {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 25px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .vs-section {
            text-align: center;
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .fighter-title {
            font-size: 1.5rem;
            margin-bottom: 15px;
            text-align: center;
            color: #ffd700;
        }

        select {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background: rgba(255,255,255,0.9);
            font-size: 1rem;
            margin-bottom: 15px;
        }

        .character-info {
            background: rgba(0,0,0,0.2);
            border-radius: 10px;
            padding: 15px;
            margin-top: 10px;
            min-height: 120px;
        }

        .element-display {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 8px;
            padding: 8px;
            border-radius: 5px;
            text-align: center;
        }

        .fire { background: linear-gradient(45deg, #ff4757, #ff6b7a); }
        .sound { background: linear-gradient(45deg, #5352ed, #7bed9f); }
        .earth { background: linear-gradient(45deg, #8b4513, #d2691e); }
        .wind { background: linear-gradient(45deg, #87ceeb, #b0e0e6); }
        .light { background: linear-gradient(45deg, #ffd700, #ffeb3b); }
        .nature { background: linear-gradient(45deg, #2ed573, #7bed9f); }
        .water { background: linear-gradient(45deg, #3742fa, #70a1ff); }
        .poison { background: linear-gradient(45deg, #8e44ad, #9b59b6); }
        .lightning { background: linear-gradient(45deg, #f39c12, #e74c3c); }
        .ice { background: linear-gradient(45deg, #74b9ff, #a29bfe); }
        .crystal { background: linear-gradient(45deg, #fd79a8, #fdcb6e); }
        .metal { background: linear-gradient(45deg, #636e72, #b2bec3); }
        .shadow { background: linear-gradient(45deg, #2d3436, #636e72); }

        .battle-btn {
            display: block;
            width: 200px;
            margin: 30px auto;
            padding: 15px 30px;
            background: linear-gradient(45deg, #ff6b6b, #ffa500);
            border: none;
            border-radius: 50px;
            color: white;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .battle-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .battle-btn:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
        }

        .battle-result {
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            padding: 30px;
            margin-top: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            display: none;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .battle-description {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .winner-announcement {
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .winner { background: linear-gradient(45deg, #00b894, #00cec9); }
        .tie { background: linear-gradient(45deg, #fdcb6e, #e17055); }

        .relationship-bonus {
            background: rgba(255,215,0,0.2);
            border-left: 4px solid #ffd700;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
        }

        @media (max-width: 768px) {
            .battle-setup {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            
            .vs-section {
                order: -1;
                font-size: 2rem;
            }
            
            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚡ Element Battle Simulator ⚡</h1>
        
        <div class="battle-setup">
            <div class="fighter-selection">
                <div class="fighter-title">Fighter 1</div>
                <select id="fighter1">
                    <option value="">Select a character...</option>
                </select>
                <div class="character-info" id="info1"></div>
            </div>
            
            <div class="vs-section">VS</div>
            
            <div class="fighter-selection">
                <div class="fighter-title">Fighter 2</div>
                <select id="fighter2">
                    <option value="">Select a character...</option>
                </select>
                <div class="character-info" id="info2"></div>
            </div>
        </div>
        
        <button class="battle-btn" id="battleBtn" disabled>⚔️ BATTLE! ⚔️</button>
        
        <div class="battle-result" id="battleResult"></div>
    </div>

    <script>
        const characters = {
            "Liam Reed": {
                element: "Fire",
                description: "Classic and chaotic. Burn it all or warm your hands. Your choice.",
                personality: ["Adventurous", "Impulsive", "Inspiring"],
                relationships: {
                    "Rowan Khanna": "best friend",
                    "Jae Kim": "best friend", 
                    "Ben Copper": "secret soft spot",
                    "Merula Snyde": "frenemies"
                }
            },
            "Rowan Khanna": {
                element: "Sound",
                description: "Sonic booms, vibration waves, and the power to shatter eardrums and glass.",
                personality: ["Analytical", "Dependable", "Perfectionist"],
                relationships: {
                    "Liam Reed": "best friend",
                    "Ben Copper": "best friend",
                    "Jae Kim": "secret soft spot"
                }
            },
            "Ben Copper": {
                element: "Earth",
                description: "Grounded power. Boulders, armor, and earthquakes included.",
                personality: ["Insightful", "Cautious", "Anxious"],
                relationships: {
                    "Rowan Khanna": "best friend",
                    "Liam Reed": "close friend",
                    "Barnaby Lee": "close friend"
                }
            },
            "Jae Kim": {
                element: "Wind",
                description: "Slicing gusts, flight, and casually flipping tables without lifting a finger.",
                personality: ["Funny", "Optimistic", "Attention-Seeking"],
                relationships: {
                    "Liam Reed": "best friend",
                    "Ben Copper": "secret soft spot",
                    "Merula Snyde": "frenemies"
                }
            },
            "Penny Haywood": {
                element: "Light",
                description: "Blinding flashes, lasers, illusions, and holy judgment vibes.",
                personality: ["Outgoing", "Sociable", "People-Pleaser"],
                relationships: {
                    "Mayumi Sasaki": "best friend",
                    "Chiara Lobosca": "close friend"
                }
            },
            "Mayumi Sasaki": {
                element: "Nature",
                description: "Vines, thorns, and plants that aren't vegan-friendly.",
                personality: ["Observant", "Loyal", "Reserved"],
                relationships: {
                    "Penny Haywood": "best friend",
                    "Chiara Lobosca": "best friend"
                }
            },
            "Chiara Lobosca": {
                element: "Water",
                description: "From gentle healing to crushing tidal waves. Hydration and devastation.",
                personality: ["Empathetic", "Patient", "Nurturing"],
                relationships: {
                    "Mayumi Sasaki": "best friend",
                    "Penny Haywood": "close friend"
                }
            },
            "Tulip Karasu": {
                element: "Poison",
                description: "Venomous strikes, acidic blasts, and toxic clouds. Bad breath weaponized.",
                personality: ["Confident", "Independent", "Reckless"],
                relationships: {
                    "Hayami Amamiya": "best friend",
                    "Merula Snyde": "dislike"
                }
            },
            "Hayami Amamiya": {
                element: "Lightning",
                description: "Fast, furious, shocking, and destructive. Zeus would approve.",
                personality: ["Realistic", "Witty", "Distrustful"],
                relationships: {
                    "Tulip Karasu": "best friend",
                    "Talbott Winger": "sibling energy",
                    "Merula Snyde": "dislike"
                }
            },
            "Talbott Winger": {
                element: "Ice",
                description: "Cool under pressure. Freeze enemies, slide into battle, Elsa-style.",
                personality: ["Perceptive", "Wise", "Distant"],
                relationships: {
                    "Andre Egwu": "best friend",
                    "Hayami Amamiya": "sibling energy",
                    "Rowan Khanna": "healthy rivalry"
                }
            },
            "Andre Egwu": {
                element: "Crystal",
                description: "Shards, prisms, armor, and reflect magic like a disco ball of doom.",
                personality: ["Hopeful", "Creative", "Idealistic"],
                relationships: {
                    "Talbott Winger": "best friend",
                    "Tulip Karasu": "sibling energy"
                }
            },
            "Barnaby Lee": {
                element: "Metal",
                description: "Control steel, bend weapons, or just become a walking tank.",
                personality: ["Fair-minded", "Empathetic", "Peace-Seeking"],
                relationships: {
                    "Mayumi Sasaki": "best friend",
                    "Ben Copper": "close friend"
                }
            },
            "Merula Snyde": {
                element: "Shadow",
                description: "Cloak yourself in fear, teleport through shadows, or just brood in the corner.",
                personality: ["Unpredictable", "Competitive", "Mysterious"],
                relationships: {
                    "Liam Reed": "secret soft spot",
                    "Jae Kim": "frenemies",
                    "Tulip Karasu": "fallout"
                }
            }
        };

        // Populate character dropdowns
        const fighter1Select = document.getElementById('fighter1');
        const fighter2Select = document.getElementById('fighter2');
        
        Object.keys(characters).forEach(name => {
            const option1 = new Option(name, name);
            const option2 = new Option(name, name);
            fighter1Select.add(option1);
            fighter2Select.add(option2);
        });

        function updateCharacterInfo(selectId, infoId) {
            const select = document.getElementById(selectId);
            const info = document.getElementById(infoId);
            const character = characters[select.value];
            
            if (character) {
                const elementClass = character.element.toLowerCase().replace('/', '');
                info.innerHTML = `
                    <div class="element-display ${elementClass}">
                        ${character.element} Element
                    </div>
                    <div>${character.description}</div>
                    <div style="margin-top: 10px; font-size: 0.9rem;">
                        <strong>Traits:</strong> ${character.personality.join(', ')}
                    </div>
                `;
            } else {
                info.innerHTML = '';
            }
            
            updateBattleButton();
        }

        function updateBattleButton() {
            const fighter1 = document.getElementById('fighter1').value;
            const fighter2 = document.getElementById('fighter2').value;
            const battleBtn = document.getElementById('battleBtn');
            
            battleBtn.disabled = !fighter1 || !fighter2 || fighter1 === fighter2;
        }

        // Element interactions
        const elementInteractions = {
            "Fire": {
                "Ice": "melts",
                "Nature": "burns",
                "Crystal": "heats and shatters",
                "Metal": "forges and weakens"
            },
            "Water": {
                "Fire": "extinguishes",
                "Earth": "erodes",
                "Lightning": "conducts dangerously"
            },
            "Earth": {
                "Lightning": "grounds",
                "Wind": "resists",
                "Metal": "shapes"
            },
            "Lightning": {
                "Water": "electrifies",
                "Metal": "conducts through",
                "Ice": "shatters with heat"
            },
            "Ice": {
                "Water": "freezes",
                "Nature": "kills with frost",
                "Wind": "creates blizzards"
            },
            "Nature": {
                "Earth": "grows from",
                "Water": "drinks deeply",
                "Poison": "resists naturally"
            },
            "Wind": {
                "Fire": "fans the flames",
                "Poison": "disperses",
                "Sound": "carries and amplifies"
            },
            "Light": {
                "Shadow": "banishes",
                "Crystal": "refracts beautifully",
                "Ice": "creates rainbows"
            },
            "Shadow": {
                "Light": "swallows",
                "Ice": "chills deeper"
            },
            "Sound": {
                "Crystal": "resonates and shatters",
                "Ice": "cracks with vibration"
            },
            "Poison": {
                "Nature": "corrupts",
                "Water": "contaminates"
            },
            "Crystal": {
                "Light": "focuses into lasers",
                "Sound": "amplifies dangerously"
            },
            "Metal": {
                "Lightning": "attracts",
                "Crystal": "reinforces"
            }
        };

        function battle() {
            const fighter1Name = document.getElementById('fighter1').value;
            const fighter2Name = document.getElementById('fighter2').value;
            const fighter1 = characters[fighter1Name];
            const fighter2 = characters[fighter2Name];
            
            const result = document.getElementById('battleResult');
            
            // Check for element interactions
            const element1 = fighter1.element;
            const element2 = fighter2.element;
            
            let battleDescription = `${fighter1Name} channels their ${element1} power while ${fighter2Name} unleashes ${element2} energy! `;
            
            // Element interaction
            let advantage = null;
            if (elementInteractions[element1] && elementInteractions[element1][element2]) {
                advantage = fighter1Name;
                battleDescription += `${element1} ${elementInteractions[element1][element2]} ${element2}! `;
            } else if (elementInteractions[element2] && elementInteractions[element2][element1]) {
                advantage = fighter2Name;
                battleDescription += `${element2} ${elementInteractions[element2][element1]} ${element1}! `;
            } else {
                battleDescription += `The elements clash with equal force! `;
            }
            
            // Personality factors
            const personalityBonus = [];
            if (fighter1.personality.includes('Impulsive') && fighter2.personality.includes('Cautious')) {
                personalityBonus.push(`${fighter1Name}'s impulsive nature catches the cautious ${fighter2Name} off guard!`);
            }
            if (fighter1.personality.includes('Analytical') && fighter2.personality.includes('Reckless')) {
                personalityBonus.push(`${fighter1Name}'s analytical mind anticipates ${fighter2Name}'s reckless moves!`);
            }
            
            // Relationship factors
            let relationshipBonus = '';
            const rel1to2 = fighter1.relationships[fighter2Name];
            const rel2to1 = fighter2.relationships[fighter1Name];
            
            if (rel1to2 === 'best friend' || rel2to1 === 'best friend') {
                relationshipBonus = `💫 Despite being best friends, they hold back just enough to avoid seriously hurting each other.`;
            } else if (rel1to2 === 'frenemies' || rel2to1 === 'frenemies') {
                relationshipBonus = `🔥 Their frenemies relationship adds extra intensity to the battle!`;
            } else if (rel1to2 === 'secret soft spot' || rel2to1 === 'secret soft spot') {
                relationshipBonus = `💕 One fighter seems to be holding back due to hidden feelings...`;
            } else if (rel1to2 === 'dislike' || rel2to1 === 'dislike') {
                relationshipBonus = `⚡ Their mutual dislike makes this battle particularly fierce!`;
            }
            
            // Determine winner
            let winner;
            let winnerClass;
            if (advantage) {
                // 70% chance advantage wins, 30% upset
                winner = Math.random() < 0.7 ? advantage : (advantage === fighter1Name ? fighter2Name : fighter1Name);
                winnerClass = 'winner';
            } else {
                // Random with slight personality influence
                const random = Math.random();
                if (random < 0.45) {
                    winner = fighter1Name;
                } else if (random < 0.9) {
                    winner = fighter2Name;
                } else {
                    winner = "It's a tie!";
                    winnerClass = 'tie';
                }
                winnerClass = winner === "It's a tie!" ? 'tie' : 'winner';
            }
            
            result.innerHTML = `
                <div class="winner-announcement ${winnerClass}">
                    ${winner === "It's a tie!" ? "🤝 Epic Stalemate!" : `🏆 ${winner} Wins!`}
                </div>
                <div class="battle-description">
                    ${battleDescription}
                    ${personalityBonus.join(' ')}
                </div>
                ${relationshipBonus ? `<div class="relationship-bonus">${relationshipBonus}</div>` : ''}
            `;
            
            result.style.display = 'block';
        }

        // Event listeners
        fighter1Select.addEventListener('change', () => updateCharacterInfo('fighter1', 'info1'));
        fighter2Select.addEventListener('change', () => updateCharacterInfo('fighter2', 'info2'));
        document.getElementById('battleBtn').addEventListener('click', battle);
    </script>
</body>
</html>
