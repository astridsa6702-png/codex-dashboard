<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Which Character Are You?</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .quiz-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .quiz-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .quiz-title {
            font-size: 2.5rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4, #45b7d1);
            background-size: 200% 200%;
            animation: gradient 3s ease infinite;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        @keyframes gradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .quiz-subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .question-container {
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }

        .question-container.active {
            opacity: 1;
            transform: translateY(0);
        }

        .question {
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
            text-align: center;
            font-weight: 500;
        }

        .answers {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .answer-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 15px;
            padding: 1rem 1.5rem;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            position: relative;
            overflow: hidden;
        }

        .answer-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s ease;
        }

        .answer-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        .answer-btn:hover::before {
            left: 100%;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 3px;
            margin-bottom: 2rem;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #4ecdc4);
            border-radius: 3px;
            transition: width 0.5s ease;
            width: 0%;
        }

        .result-container {
            text-align: center;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.6s ease;
        }

        .result-container.show {
            opacity: 1;
            transform: scale(1);
        }

        .character-card {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 2rem;
            margin: 1rem 0;
            border: 2px solid rgba(255, 255, 255, 0.3);
        }

        .character-name {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 0.5rem;
            color: #4ecdc4;
        }

        .character-role {
            font-size: 1.2rem;
            font-style: italic;
            margin-bottom: 1rem;
            opacity: 0.9;
        }

        .character-details {
            text-align: left;
            margin-top: 1rem;
        }

        .detail-section {
            margin-bottom: 1rem;
            padding: 0.8rem;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .detail-label {
            font-weight: bold;
            color: #ff6b6b;
            margin-bottom: 0.3rem;
        }

        .restart-btn {
            background: linear-gradient(45deg, #ff6b6b, #4ecdc4);
            border: none;
            border-radius: 25px;
            padding: 1rem 2rem;
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: all 0.3s ease;
        }

        .restart-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .question-counter {
            text-align: center;
            margin-bottom: 1rem;
            opacity: 0.8;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="quiz-container">
        <div class="quiz-header">
            <h1 class="quiz-title">Which Character Are You?</h1>
            <p class="quiz-subtitle">Discover your elemental personality match!</p>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="question-counter" id="questionCounter">Question 1 of 10</div>

        <div class="question-container active" id="questionContainer">
            <div class="question" id="questionText"></div>
            <div class="answers" id="answersContainer"></div>
        </div>

        <div class="result-container" id="resultContainer">
            <h2>Your Result:</h2>
            <div class="character-card" id="characterCard"></div>
            <button class="restart-btn" onclick="restartQuiz()">Take Quiz Again</button>
        </div>
    </div>

    <script>
        const characters = {
            liam: {

            },

            },

            },
            penny: {

            },

            },
            chiara: {

                ability: "Water - From gentle healing to crushing tidal waves. Hydration and devastation.",
                arc: "Learns to care for themselves as deeply as they care for everyone else.",
                traits: ['empathetic', 'nurturing', 'supportive', 'self-sacrificing', 'patient', 'sensitive']
            },
            tulip: {
                name: "Tulip Karasu",
                pronouns: "she/her",
                role: "The Rebel",
                appearance: "Red hair styled in a shoulder-length butterfly cut, hazel eyes, 170 cm",

            },
            hayami: {

            },
            talbott: {
                name: "Talbott Winger",
                pronouns: "he/him",
                role: "The Observer",
                appearance: "Slick back brown short hair, brown eyes, 175 cm",
                personality: "Perceptive, wise, nonjudgmental, passive, distant, quiet, hidden depths",
                ability: "Ice - Cool under pressure. Freeze enemies, slide into battle, Elsa-style.",
                arc: "Learns that watching from the sidelines isn't the same as truly living—and sometimes, they need to step into the spotlight.",
                traits: ['observant', 'wise', 'quiet', 'perceptive', 'distant', 'passive']
            },
            andre: {
                name: "Andre Egwu",
                pronouns: "he/they",
                role: "The Romantic",
                appearance: "Buzz cut, brown eyes, well-dressed, fashion-conscious, 171 cm",
                personality: "Hopeful, compassionate, creative, idealistic, overemotional, sentimental, dreamy",
                ability: "Crystal - Shards, prisms, armor, and reflect magic like a disco ball of doom.",
                arc: "Realizes that love isn't just about fantasy—it's built through vulnerability, truth, and imperfection.",
                traits: ['romantic', 'idealistic', 'creative', 'compassionate', 'dreamy', 'sentimental']
            },
            barnaby: {
                name: "Barnaby Lee",
                pronouns: "he/him",
                role: "The Mediator",
                appearance: "Short brown hair, green eyes, tall, muscular, intimidating but friendly face, 176 cm",
                personality: "Naive, fair-minded, empathetic, conflict-avoidant, overburdened, peace-seeking, neutral",
                ability: "Metal - Control steel, bend weapons, or just become a walking tank.",
                arc: "Discovers that keeping the peace is noble, but their own voice and needs matter too.",
                traits: ['peaceful', 'fair-minded', 'empathetic', 'conflict-avoidant', 'neutral', 'naive']
            },
            merula: {
                name: "Merula Snyde",
                pronouns: "she/her",
                role: "The Wild Card",
                appearance: "Brown hair styled in a short layered cut, brown eyes, 167 cm",
                personality: "Unpredictable, prideful, competitive, antagonistic, unreliable, impulsive, mysterious",
                ability: "Shadow - Cloak yourself in fear, teleport through shadows, or just brood in the corner.",
                arc: "Initially the unpredictable antagonist and rival to the protagonist, they eventually realize that chaos without purpose is empty—and find greater meaning in standing with the group rather than against it.",
                traits: ['unpredictable', 'competitive', 'prideful', 'mysterious', 'impulsive', 'antagonistic']
            }
        };

        const questions = [
            {
                question: "What's your ideal way to spend a weekend?",
                answers: [
                    { text: "Exploring a new place or trying an extreme sport", traits: ['adventurous', 'spontaneous'] },
                    { text: "Reading a fascinating book or learning something new", traits: ['analytical', 'knowledgeable'] },
                    { text: "Hanging out with friends and making everyone laugh", traits: ['humorous', 'social'] },
                    { text: "Having a quiet, reflective time alone", traits: ['introspective', 'reserved'] }
                ]
            },
            {
                question: "When facing a difficult decision, you:",
                answers: [
                    { text: "Go with your gut instinct immediately", traits: ['impulsive', 'spontaneous'] },
                    { text: "Research all options thoroughly before deciding", traits: ['analytical', 'cautious'] },
                    { text: "Ask friends for their opinions and advice", traits: ['social', 'people-pleaser'] },
                    { text: "Overthink every possible outcome", traits: ['anxious', 'thoughtful'] }
                ]
            },
            {
                question: "Your friends would describe you as:",
                answers: [
                    { text: "The life of the party who brings energy everywhere", traits: ['charismatic', 'outgoing'] },
                    { text: "The reliable one who always has a plan", traits: ['dependable', 'logical'] },
                    { text: "The caring one who puts others first", traits: ['empathetic', 'nurturing'] },
                    { text: "The mysterious one with hidden depths", traits: ['mysterious', 'quiet'] }
                ]
            },
            {
                question: "How do you handle conflict?",
                answers: [
                    { text: "Face it head-on with confidence", traits: ['bold', 'confident'] },
                    { text: "Try to find a logical solution that works for everyone", traits: ['fair-minded', 'analytical'] },
                    { text: "Avoid it or make jokes to lighten the mood", traits: ['avoidant', 'humorous'] },
                    { text: "Listen to all sides and try to keep the peace", traits: ['peaceful', 'empathetic'] }
                ]
            },
            {
                question: "What motivates you most?",
                answers: [
                    { text: "The thrill of new experiences and adventures", traits: ['adventurous', 'independent'] },
                    { text: "The satisfaction of solving complex problems", traits: ['analytical', 'perfectionist'] },
                    { text: "Making others happy and bringing people together", traits: ['people-pleaser', 'social'] },
                    { text: "Finding meaning and authenticity in life", traits: ['idealistic', 'thoughtful'] }
                ]
            },
            {
                question: "Your biggest weakness might be:",
                answers: [
                    { text: "Being too impulsive and not thinking things through", traits: ['impulsive', 'spontaneous'] },
                    { text: "Overthinking and getting paralyzed by analysis", traits: ['anxious', 'perfectionist'] },
                    { text: "Caring too much about what others think", traits: ['people-pleaser', 'self-doubting'] },
                    { text: "Being too cynical or distrustful of others", traits: ['cynical', 'distrustful'] }
                ]
            },
            {
                question: "In a group project, you typically:",
                answers: [
                    { text: "Take charge and lead the team", traits: ['leadership', 'confident'] },
                    { text: "Research and organize all the information", traits: ['analytical', 'knowledgeable'] },
                    { text: "Keep everyone motivated and resolve conflicts", traits: ['peaceful', 'supportive'] },
                    { text: "Work quietly but contribute valuable insights", traits: ['observant', 'reserved'] }
                ]
            },
            {
                question: "How do you express your creativity?",
                answers: [
                    { text: "Through bold, dramatic, and attention-grabbing ways", traits: ['bold', 'attention-seeking'] },
                    { text: "Through detailed, well-planned artistic projects", traits: ['perfectionist', 'creative'] },
                    { text: "Through connecting with others and inspiring them", traits: ['empowering', 'charismatic'] },
                    { text: "Through quiet, personal, and meaningful expression", traits: ['introspective', 'creative'] }
                ]
            },
            {
                question: "What's your approach to rules and authority?",
                answers: [
                    { text: "Rules are meant to be broken or at least questioned", traits: ['rebellious', 'contrarian'] },
                    { text: "Rules exist for good reasons and should be followed", traits: ['logical', 'cautious'] },
                    { text: "Rules are okay as long as they don't hurt anyone", traits: ['peaceful', 'fair-minded'] },
                    { text: "I prefer to stay under the radar and avoid trouble", traits: ['withdrawn', 'conflict-avoidant'] }
                ]
            },
            {
                question: "Your ideal superpower would be:",
                answers: [
                    { text: "Something flashy that lets you be the hero", traits: ['charismatic', 'attention-seeking'] },
                    { text: "Something strategic that gives you an advantage", traits: ['analytical', 'logical'] },
                    { text: "Something that helps and heals others", traits: ['nurturing', 'empathetic'] },
                    { text: "Something mysterious that others don't understand", traits: ['mysterious', 'independent'] }
                ]
            }
        ];

        let currentQuestion = 0;
        let scores = {};
        
        // Initialize scores
        Object.keys(characters).forEach(char => {
            scores[char] = 0;
        });

        function displayQuestion() {
            const questionContainer = document.getElementById('questionContainer');
            const questionText = document.getElementById('questionText');
            const answersContainer = document.getElementById('answersContainer');
            const questionCounter = document.getElementById('questionCounter');
            const progressFill = document.getElementById('progressFill');

            questionText.textContent = questions[currentQuestion].question;
            questionCounter.textContent = `Question ${currentQuestion + 1} of ${questions.length}`;
            progressFill.style.width = `${((currentQuestion + 1) / questions.length) * 100}%`;

            answersContainer.innerHTML = '';
            
            questions[currentQuestion].answers.forEach((answer, index) => {
                const button = document.createElement('button');
                button.className = 'answer-btn';
                button.textContent = answer.text;
                button.onclick = () => selectAnswer(answer.traits);
                answersContainer.appendChild(button);
            });
        }

        function selectAnswer(traits) {
            // Add points to characters based on matching traits
            Object.keys(characters).forEach(charKey => {
                const character = characters[charKey];
                traits.forEach(trait => {
                    if (character.traits.includes(trait)) {
                        scores[charKey] += 1;
                    }
                });
            });

            currentQuestion++;
            
            if (currentQuestion < questions.length) {
                const questionContainer = document.getElementById('questionContainer');
                questionContainer.classList.remove('active');
                
                setTimeout(() => {
                    displayQuestion();
                    questionContainer.classList.add('active');
                }, 300);
            } else {
                showResult();
            }
        }

        function showResult() {
            // Find character with highest score
            let maxScore = 0;
            let resultCharacter = 'liam';
            
            Object.keys(scores).forEach(charKey => {
                if (scores[charKey] > maxScore) {
                    maxScore = scores[charKey];
                    resultCharacter = charKey;
                }
            });

            const character = characters[resultCharacter];
            const questionContainer = document.getElementById('questionContainer');
            const resultContainer = document.getElementById('resultContainer');
            const characterCard = document.getElementById('characterCard');

            questionContainer.style.display = 'none';
            document.getElementById('questionCounter').style.display = 'none';

            characterCard.innerHTML = `
                <div class="character-name">${character.name} (${character.pronouns})</div>
                <div class="character-role">${character.role}</div>
                <div class="character-details">
                    <div class="detail-section">
                        <div class="detail-label">Appearance:</div>
                        <div>${character.appearance}</div>
                    </div>
                    <div class="detail-section">
                        <div class="detail-label">Personality:</div>
                        <div>${character.personality}</div>
                    </div>
                    <div class="detail-section">
                        <div class="detail-label">Special Ability:</div>
                        <div>${character.ability}</div>
                    </div>
                    <div class="detail-section">
                        <div class="detail-label">Character Arc:</div>
                        <div>${character.arc}</div>
                    </div>
                </div>
            `;

            setTimeout(() => {
                resultContainer.classList.add('show');
            }, 300);
        }

        function restartQuiz() {
            currentQuestion = 0;
            scores = {};
            Object.keys(characters).forEach(char => {
                scores[char] = 0;
            });

            const questionContainer = document.getElementById('questionContainer');
            const resultContainer = document.getElementById('resultContainer');
            const progressFill = document.getElementById('progressFill');

            resultContainer.classList.remove('show');
            document.getElementById('questionCounter').style.display = 'block';
            
            setTimeout(() => {
                questionContainer.style.display = 'block';
                progressFill.style.width = '10%';
                displayQuestion();
                questionContainer.classList.add('active');
            }, 300);
        }

        // Initialize the quiz
        displayQuestion();
    </script>
</body>
</html>
