<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Group Dynamic Simulator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
        }
        
        h1 {
            text-align: center;
            color: #4a5568;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }
        
        .selection-area {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }
        
        .character-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            max-height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
            border: 2px solid #e2e8f0;
        }
        
        .character-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        
        .character-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
        }
        
        .character-card.selected {
            border-color: #667eea;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            transform: scale(1.05);
        }
        
        .character-name {
            font-weight: bold;
            font-size: 1.1em;
            margin-bottom: 5px;
        }
        
        .character-role {
            font-size: 0.9em;
            opacity: 0.8;
            margin-bottom: 10px;
        }
        
        .character-element {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 20px;
            font-size: 0.8em;
            font-weight: bold;
            margin-top: 5px;
        }
        
        .fire { background: #ff6b6b; color: white; }
        .sound { background: #4ecdc4; color: white; }
        .earth { background: #8b5a3c; color: white; }
        .wind { background: #95e1d3; color: #333; }
        .light { background: #ffd93d; color: #333; }
        .nature { background: #6ab04c; color: white; }
        .water { background: #3742fa; color: white; }
        .poison { background: #a55eea; color: white; }
        .lightning { background: #f39c12; color: white; }
        .ice { background: #74b9ff; color: white; }
        .crystal { background: #fd79a8; color: white; }
        .metal { background: #636e72; color: white; }
        .shadow { background: #2d3436; color: white; }
        
        .selected-group {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            border: 2px solid #e2e8f0;
        }
        
        .selected-group h3 {
            margin-bottom: 15px;
            color: #4a5568;
        }
        
        .selected-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        .selected-character {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .remove-btn {
            background: rgba(255, 255, 255, 0.3);
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            cursor: pointer;
            color: white;
            font-size: 12px;
        }
        
        .simulate-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-size: 1.1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }
        
        .simulate-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        
        .simulate-btn:disabled {
            background: #cbd5e0;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        
        .results {
            margin-top: 30px;
            padding: 25px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            border-left: 5px solid #667eea;
        }
        
        .results h3 {
            color: #4a5568;
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        
        .dynamic-analysis {
            display: grid;
            gap: 20px;
        }
        
        .analysis-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            border-left: 4px solid #667eea;
        }
        
        .analysis-section h4 {
            color: #667eea;
            margin-bottom: 10px;
            font-size: 1.2em;
        }
        
        .relationship-web {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 10px;
        }
        
        .relationship-tag {
            padding: 6px 12px;
            border-radius: 15px;
            font-size: 0.9em;
            font-weight: bold;
        }
        
        .best-friends { background: #48bb78; color: white; }
        .close-friends { background: #38b2ac; color: white; }
        .romantic { background: #ed64a6; color: white; }
        .rivalry { background: #f56565; color: white; }
        .soft-spot { background: #d69e2e; color: white; }
        
        .personality-mix {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 10px;
        }
        
        .personality-trait {
            background: #667eea;
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            text-align: center;
            font-size: 0.9em;
        }
        
        .scenario {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-top: 15px;
        }
        
        .scenario h5 {
            margin-bottom: 10px;
            font-size: 1.1em;
        }
        
        @media (max-width: 768px) {
            .selection-area {
                grid-template-columns: 1fr;
            }
            
            .character-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            }
            
            h1 {
                font-size: 2em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Group Dynamic Simulator</h1>
        
        <div class="selection-area">
            <div>
                <h3>Select Characters</h3>
                <div class="character-grid" id="characterGrid"></div>
            </div>
            
            <div class="selected-group">
                <h3>Selected Group</h3>
                <div class="selected-list" id="selectedList"></div>
                <button class="simulate-btn" id="simulateBtn" onclick="simulateGroup()" disabled>
                    Simulate Group Dynamic
                </button>
            </div>
        </div>
        
        <div class="results" id="results" style="display: none;">
            <h3>Group Dynamic Analysis</h3>
            <div class="dynamic-analysis" id="analysis"></div>
        </div>
    </div>

    <script>
        const characters = [
            {
                name: "Liam Reed",
                role: "The Explorer",
                element: "Fire",
                personality: ["Adventurous", "Curious", "Inspiring", "Impulsive", "Restless", "Spontaneous", "Independent"],
                relationships: {
                    bestFriends: ["Rowan", "Jae"],
                    closeFriends: ["Ben", "Jae"],
                    rivalry: ["Merula"],
                    softSpot: ["Ben"],
                    romantic: ["Rowan", "Merula"]
                },
                arc: "Learns that chasing every thrill means nothing without people worth coming home to."
            },
            {
                name: "Rowan Khanna",
                role: "The Brain",
                element: "Sound",
                personality: ["Analytical", "Knowledgeable", "Dependable", "Know-It-All", "Detached", "Perfectionist", "Reserved"],
                relationships: {
                    bestFriends: ["Liam", "Ben"],
                    closeFriends: ["Ben", "Jae"],
                    rivalry: ["Talbott", "Liam"],
                    softSpot: ["Jae"],
                    romantic: ["Liam", "Ben"]
                },
                arc: "Realizes that not every problem can be solved with logic---some require heart."
            },
            {
                name: "Ben Copper",
                role: "The Overthinker",
                element: "Earth",
                personality: ["Insightful", "Cautious", "Reflective", "Indecisive", "Anxious", "Self-Critical", "Introspective"],
                relationships: {
                    bestFriends: ["Rowan"],
                    closeFriends: ["Liam", "Jae", "Barnaby"],
                    romantic: ["Rowan", "Barnaby"]
                },
                arc: "Learns to trust their instincts and that not every decision needs to be perfect to be right."
            },
            {
                name: "Jae Kim",
                role: "The Comic Relief",
                element: "Wind",
                personality: ["Funny", "Optimistic", "Opportunistic", "Avoidant", "Inappropriate", "Playful", "Attention-Seeking"],
                relationships: {
                    bestFriends: ["Liam"],
                    closeFriends: ["Ben", "Rowan", "Penny"],
                    rivalry: ["Merula"],
                    softSpot: ["Ben"],
                    romantic: ["Liam", "Merula"]
                },
                arc: "Discovers that being the funny one doesn't mean hiding their real feelings forever."
            },
            {
                name: "Penny Haywood",
                role: "The Connector",
                element: "Light",
                personality: ["Outgoing", "Sociable", "Empowering", "Nosy", "FOMO-prone", "Talkative", "People-Pleaser"],
                relationships: {
                    bestFriends: ["Mayumi"],
                    closeFriends: ["Chiara", "Jae", "Barnaby"],
                    romantic: ["Mayumi", "Barnaby"]
                },
                arc: "Learns that while they bring everyone together, they also deserve deep connections of their own."
            },
            {
                name: "Mayumi Sasaki",
                role: "The Shy One",
                element: "Nature",
                personality: ["Observant", "Thoughtful", "Loyal", "Withdrawn", "Self-doubting", "Soft-spoken", "Reserved"],
                relationships: {
                    bestFriends: ["Penny", "Chiara"],
                    closeFriends: ["Barnaby"],
                    romantic: ["Penny", "Chiara"]
                },
                arc: "Finds their voice and realizes that quiet strength can still change everything."
            },
            {
                name: "Chiara Lobosca",
                role: "The Caregiver",
                element: "Water",
                personality: ["Empathetic", "Supportive", "Patient", "Self-Sacrificing", "Overprotective", "Nurturing", "Sensitive"],
                relationships: {
                    bestFriends: ["Mayumi"],
                    closeFriends: ["Penny", "Barnaby"],
                    romantic: ["Mayumi"]
                },
                arc: "Learns to care for themselves as deeply as they care for everyone else."
            },
            {
                name: "Tulip Karasu",
                role: "The Rebel",
                element: "Poison",
                personality: ["Confident", "Independent", "Bold", "Stubborn", "Reckless", "Blunt", "Contrarian"],
                relationships: {
                    bestFriends: ["Hayami"],
                    closeFriends: ["Andre", "Talbott"],
                    rivalry: ["Hayami"],
                    fallout: ["Merula"],
                    dislike: ["Merula"],
                    sibling: ["Andre"],
                    romantic: ["Hayami"]
                },
                arc: "Discovers that true freedom isn't just breaking rules---it's knowing what's worth fighting for."
            },
            {
                name: "Hayami Amamiya",
                role: "The Cynic",
                element: "Lightning",
                personality: ["Realistic", "Witty", "Loyal", "Distrustful", "Pessimistic", "Blunt", "Charismatic"],
                relationships: {
                    bestFriends: ["Tulip"],
                    closeFriends: ["Talbott", "Andre"],
                    rivalry: ["Tulip"],
                    dislike: ["Merula"],
                    sibling: ["Talbott"],
                    romantic: ["Tulip"]
                },
                arc: "Discovers that hope isn't weakness---and letting people in doesn't always lead to disappointment."
            },
            {
                name: "Talbott Winger",
                role: "The Observer",
                element: "Ice",
                personality: ["Perceptive", "Wise", "Nonjudgmental", "Passive", "Distant", "Quiet", "Hidden depths"],
                relationships: {
                    bestFriends: ["Andre"],
                    closeFriends: ["Hayami", "Tulip"],
                    rivalry: ["Rowan"],
                    dislike: ["Merula"],
                    sibling: ["Hayami"],
                    romantic: ["Andre"]
                },
                arc: "Learns that watching from the sidelines isn't the same as truly living---and sometimes, they need to step into the spotlight."
            },
            {
                name: "Andre Egwu",
                role: "The Romantic",
                element: "Crystal",
                personality: ["Hopeful", "Compassionate", "Creative", "Idealistic", "Overemotional", "Sentimental", "Dreamy"],
                relationships: {
                    bestFriends: ["Talbott"],
                    closeFriends: ["Tulip", "Hayami"],
                    sibling: ["Tulip"],
                    romantic: ["Talbott"]
                },
                arc: "Realizes that love isn't just about fantasy---it's built through vulnerability, truth, and imperfection."
            },
            {
                name: "Barnaby Lee",
                role: "The Mediator",
                element: "Metal",
                personality: ["Naive", "Fair-minded", "Empathetic", "Conflict-Avoidant", "Overburdened", "Peace-Seeking", "Neutral"],
                relationships: {
                    bestFriends: ["Mayumi"],
                    closeFriends: ["Ben", "Chiara", "Penny"],
                    romantic: ["Ben", "Penny"]
                },
                arc: "Discovers that keeping the peace is noble, but their own voice and needs matter too."
            },
            {
                name: "Merula Snyde",
                role: "The Wild Card",
                element: "Shadow",
                personality: ["Unpredictable", "Prideful", "Competitive", "Antagonistic", "Unreliable", "Impulsive", "Mysterious"],
                relationships: {
                    closeFriends: ["Jae"],
                    rivalry: ["Liam", "Jae"],
                    fallout: ["Tulip"],
                    softSpot: ["Liam"],
                    romantic: ["Liam", "Jae"]
                },
                arc: "Initially the unpredictable antagonist and rival to the protagonist, they eventually realize that chaos without purpose is empty---and find greater meaning in standing with the group rather than against it."
            }
        ];

        let selectedCharacters = [];

        function getElementClass(element) {
            return element.toLowerCase().replace(/[^a-z]/g, '');
        }

        function renderCharacterGrid() {
            const grid = document.getElementById('characterGrid');
            grid.innerHTML = '';
            
            characters.forEach((char, index) => {
                const card = document.createElement('div');
                card.className = `character-card ${selectedCharacters.includes(index) ? 'selected' : ''}`;
                card.onclick = () => toggleCharacter(index);
                
                card.innerHTML = `
                    <div class="character-name">${char.name}</div>
                    <div class="character-role">${char.role}</div>
                    <div class="character-element ${getElementClass(char.element)}">${char.element}</div>
                `;
                
                grid.appendChild(card);
            });
        }

        function toggleCharacter(index) {
            const charIndex = selectedCharacters.indexOf(index);
            if (charIndex > -1) {
                selectedCharacters.splice(charIndex, 1);
            } else {
                selectedCharacters.push(index);
            }
            
            renderCharacterGrid();
            renderSelectedList();
            updateSimulateButton();
        }

        function removeCharacter(index) {
            const charIndex = selectedCharacters.indexOf(index);
            if (charIndex > -1) {
                selectedCharacters.splice(charIndex, 1);
                renderCharacterGrid();
                renderSelectedList();
                updateSimulateButton();
            }
        }

        function renderSelectedList() {
            const list = document.getElementById('selectedList');
            list.innerHTML = '';
            
            selectedCharacters.forEach(index => {
                const char = characters[index];
                const item = document.createElement('div');
                item.className = 'selected-character';
                item.innerHTML = `
                    ${char.name}
                    <button class="remove-btn" onclick="removeCharacter(${index})">×</button>
                `;
                list.appendChild(item);
            });
        }

        function updateSimulateButton() {
            const btn = document.getElementById('simulateBtn');
            btn.disabled = selectedCharacters.length < 2;
        }

        function analyzeRelationships() {
            const relationships = [];
            const selectedChars = selectedCharacters.map(i => characters[i]);
            
            for (let i = 0; i < selectedChars.length; i++) {
                for (let j = i + 1; j < selectedChars.length; j++) {
                    const char1 = selectedChars[i];
                    const char2 = selectedChars[j];
                    
                    // Check relationships between char1 and char2
                    const rel = [];
                    
                    if (char1.relationships.bestFriends?.includes(char2.name.split(' ')[0])) {
                        rel.push({ type: 'Best Friends', class: 'best-friends' });
                    }
                    if (char1.relationships.closeFriends?.includes(char2.name.split(' ')[0])) {
                        rel.push({ type: 'Close Friends', class: 'close-friends' });
                    }
                    if (char1.relationships.romantic?.includes(char2.name.split(' ')[0])) {
                        rel.push({ type: 'Romantic Interest', class: 'romantic' });
                    }
                    if (char1.relationships.rivalry?.includes(char2.name.split(' ')[0])) {
                        rel.push({ type: 'Rivalry', class: 'rivalry' });
                    }
                    if (char1.relationships.softSpot?.includes(char2.name.split(' ')[0])) {
                        rel.push({ type: 'Soft Spot', class: 'soft-spot' });
                    }
                    
                    // Check reverse relationships
                    if (char2.relationships.bestFriends?.includes(char1.name.split(' ')[0])) {
                        rel.push({ type: 'Best Friends', class: 'best-friends' });
                    }
                    if (char2.relationships.closeFriends?.includes(char1.name.split(' ')[0])) {
                        rel.push({ type: 'Close Friends', class: 'close-friends' });
                    }
                    if (char2.relationships.romantic?.includes(char1.name.split(' ')[0])) {
                        rel.push({ type: 'Romantic Interest', class: 'romantic' });
                    }
                    if (char2.relationships.rivalry?.includes(char1.name.split(' ')[0])) {
                        rel.push({ type: 'Rivalry', class: 'rivalry' });
                    }
                    if (char2.relationships.softSpot?.includes(char1.name.split(' ')[0])) {
                        rel.push({ type: 'Soft Spot', class: 'soft-spot' });
                    }
                    
                    if (rel.length > 0) {
                        relationships.push({
                            pair: `${char1.name} & ${char2.name}`,
                            connections: rel
                        });
                    }
                }
            }
            
            return relationships;
        }

        function generateScenario() {
            const selectedChars = selectedCharacters.map(i => characters[i]);
            const scenarios = [
                "Planning a surprise party",
                "Stuck in an elevator together",
                "On a dangerous mission",
                "Competing in a tournament",
                "Lost in an unknown place",
                "Solving a mystery",
                "Dealing with a crisis",
                "Working on a group project",
                "Planning a heist",
                "Exploring ancient ruins"
            ];
            
            const scenario = scenarios[Math.floor(Math.random() * scenarios.length)];
            const leaders = selectedChars.filter(char => 
                char.personality.some(trait => 
                    ['Independent', 'Inspiring', 'Bold', 'Charismatic'].includes(trait)
                )
            );
            
            const peacemakers = selectedChars.filter(char => 
                char.personality.some(trait => 
                    ['Peace-Seeking', 'Empathetic', 'Fair-minded', 'Supportive'].includes(trait)
                )
            );
            
            const wildCards = selectedChars.filter(char => 
                char.personality.some(trait => 
                    ['Confident', 'Unpredictable', 'Impulsive', 'Reckless', 'Chaotic'].includes(trait)
                )
            );
            
            let prediction = `In this scenario of ${scenario.toLowerCase()}, `;
            
            if (leaders.length > 0) {
                prediction += `${leaders[0].name} would likely take charge with their ${leaders[0].role.toLowerCase()} nature. `;
            }
            
            if (peacemakers.length > 0) {
                prediction += `${peacemakers[0].name} would work to keep everyone together and resolve conflicts. `;
            }
            
            if (wildCards.length > 0) {
                prediction += `Meanwhile, ${wildCards[0].name} might throw everyone's plans into chaos with their unpredictable actions. `;
            }
            
            return { scenario, prediction };
        }

        function simulateGroup() {
            const selectedChars = selectedCharacters.map(i => characters[i]);
            const relationships = analyzeRelationships();
            const { scenario, prediction } = generateScenario();
            
            // Analyze personality mix
            const allTraits = selectedChars.flatMap(char => char.personality);
            const traitCounts = {};
            allTraits.forEach(trait => {
                traitCounts[trait] = (traitCounts[trait] || 0) + 1;
            });
            
            const dominantTraits = Object.entries(traitCounts)
                .sort(([,a], [,b]) => b - a)
                .slice(0, 6)
                .map(([trait]) => trait);
            
            // Generate group energy assessment
            const energies = {
                harmony: 0,
                tension: 0,
                energy: 0,
                stability: 0
            };
            
            relationships.forEach(rel => {
                rel.connections.forEach(conn => {
                    switch(conn.class) {
                        case 'best-friends':
                            energies.harmony += 3;
                            energies.stability += 2;
                            break;
                        case 'close-friends':
                            energies.harmony += 2;
                            energies.stability += 1;
                            break;
                        case 'romantic':
                            energies.energy += 3;
                            energies.tension += 2;
                            break;
                        case 'rivalry':
                            energies.tension += 3;
                            energies.energy += 1;
                            break;
                        case 'soft-spot':
                            energies.harmony += 1;
                            energies.stability += 1;
                            break;
                    }
                });
            });
            
            const analysis = document.getElementById('analysis');
            analysis.innerHTML = `
                <div class="analysis-section">
                    <h4>👥 Group Composition</h4>
                    <p><strong>${selectedChars.length} characters selected:</strong> ${selectedChars.map(c => c.name).join(', ')}</p>
                    <p><strong>Roles present:</strong> ${selectedChars.map(c => c.role).join(', ')}</p>
                </div>
                
                <div class="analysis-section">
                    <h4>💫 Key Relationships</h4>
                    ${relationships.length > 0 ? `
                        <div class="relationship-web">
                            ${relationships.map(rel => `
                                <div style="margin-bottom: 10px;">
                                    <strong>${rel.pair}:</strong>
                                    ${rel.connections.map(conn => 
                                        `<span class="relationship-tag ${conn.class}">${conn.type}</span>`
                                    ).join(' ')}
                                </div>
                            `).join('')}
                        </div>
                    ` : '<p>No strong relationships detected in this group.</p>'}
                </div>
                
                <div class="analysis-section">
                    <h4>🧠 Personality Mix</h4>
                    <div class="personality-mix">
                        ${dominantTraits.map(trait => 
                            `<div class="personality-trait">${trait}</div>`
                        ).join('')}
                    </div>
                </div>
                
                <div class="analysis-section">
                    <h4>⚡ Group Energy</h4>
                    <p><strong>Harmony Level:</strong> ${energies.harmony > 5 ? 'High' : energies.harmony > 2 ? 'Medium' : 'Low'}</p>
                    <p><strong>Tension Level:</strong> ${energies.tension > 5 ? 'High' : energies.tension > 2 ? 'Medium' : 'Low'}</p>
                    <p><strong>Overall Energy:</strong> ${energies.energy > 5 ? 'High' : energies.energy > 2 ? 'Medium' : 'Low'}</p>
                    <p><strong>Stability:</strong> ${energies.stability > 5 ? 'Very Stable' : energies.stability > 2 ? 'Stable' : 'Unstable'}</p>
                </div>
                
                <div class="scenario">
                    <h5>🎭 Scenario Simulation: ${scenario}</h5>
                    <p>${prediction}</p>
                </div>
            `;
            
            document.getElementById('results').style.display = 'block';
            document.getElementById('results').scrollIntoView({ behavior: 'smooth' });
        }

        // Initialize
        renderCharacterGrid();
    </script>
