<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Relationship Web</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            overflow-x: auto;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            position: relative;
        }

        .title {
            text-align: center;
            color: white;
            font-size: 2.5rem;
            margin-bottom: 2rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            animation: fadeInDown 1s ease-out;
        }

        .web-container {
            position: relative;
            width: 100%;
            height: 800px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .character-node {
            position: absolute;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ff6b6b, #ee5a52);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            z-index: 10;
            animation: nodeAppear 0.8s ease-out;
            border: 3px solid rgba(255,255,255,0.3);
        }

        .character-node:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 30px rgba(0,0,0,0.4);
            z-index: 20;
        }

        .character-name {
            font-size: 0.9rem;
            text-align: center;
            line-height: 1.2;
            margin-bottom: 2px;
        }

        .character-ability {
            font-size: 0.7rem;
            opacity: 0.8;
            text-align: center;
        }

        .connection-line {
            position: absolute;
            height: 2px;
            background: rgba(255,255,255,0.4);
            transform-origin: left center;
            z-index: 1;
            opacity: 0;
            transition: all 0.3s ease;
        }

        .connection-line.visible {
            opacity: 1;
            animation: lineGrow 0.5s ease-out;
        }

        .connection-line.best-friends {
            background: linear-gradient(90deg, #ff6b6b, #ffd93d);
            height: 4px;
            box-shadow: 0 0 10px rgba(255, 107, 107, 0.5);
        }

        .connection-line.close-friends {
            background: linear-gradient(90deg, #4ecdc4, #44a08d);
            height: 3px;
        }

        .connection-line.romantic {
            background: linear-gradient(90deg, #ff758c, #ff7eb3);
            height: 3px;
            box-shadow: 0 0 8px rgba(255, 117, 140, 0.5);
        }

        .connection-line.rivalry {
            background: linear-gradient(90deg, #ff9500, #ff5722);
            height: 2px;
            animation: pulse 2s infinite;
        }

        .info-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 300px;
            background: rgba(255,255,255,0.9);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            transform: translateX(100%);
            transition: transform 0.3s ease;
            z-index: 30;
        }

        .info-panel.active {
            transform: translateX(0);
        }

        .info-title {
            font-size: 1.4rem;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }

        .info-ability {
            color: #666;
            font-style: italic;
            margin-bottom: 15px;
        }

        .relationships-list {
            list-style: none;
        }

        .relationships-list li {
            margin: 8px 0;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.9rem;
        }

        .relationship-best-friends { background: linear-gradient(90deg, #ff6b6b, #ffd93d); color: white; }
        .relationship-close-friends { background: linear-gradient(90deg, #4ecdc4, #44a08d); color: white; }
        .relationship-romantic { background: linear-gradient(90deg, #ff758c, #ff7eb3); color: white; }
        .relationship-rivalry { background: linear-gradient(90deg, #ff9500, #ff5722); color: white; }

        .legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(255,255,255,0.9);
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
            font-size: 0.9rem;
        }

        .legend-line {
            width: 30px;
            height: 3px;
            margin-right: 10px;
            border-radius: 2px;
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes nodeAppear {
            from { opacity: 0; transform: scale(0.5); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes lineGrow {
            from { transform: scaleX(0); }
            to { transform: scaleX(1); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* Character-specific colors */
        .char-liam { background: linear-gradient(135deg, #ff6b6b, #ee5a52); }
        .char-rowan { background: linear-gradient(135deg, #4ecdc4, #44a08d); }
        .char-ben { background: linear-gradient(135deg, #a8e6cf, #7fcdcd); }
        .char-jae { background: linear-gradient(135deg, #ffd93d, #ffb74d); }
        .char-penny { background: linear-gradient(135deg, #ff758c, #ff7eb3); }
        .char-mayumi { background: linear-gradient(135deg, #c7a4ff, #9575cd); }
        .char-chiara { background: linear-gradient(135deg, #64b5f6, #42a5f5); }
        .char-tulip { background: linear-gradient(135deg, #ff8a65, #ff7043); }
        .char-hayami { background: linear-gradient(135deg, #ffb74d, #ffa726); }
        .char-talbott { background: linear-gradient(135deg, #90caf9, #64b5f6); }
        .char-andre { background: linear-gradient(135deg, #e1bee7, #ce93d8); }
        .char-barnaby { background: linear-gradient(135deg, #bcaaa4, #a1887f); }
        .char-merula { background: linear-gradient(135deg, #616161, #424242); }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">Character Relationship Web</h1>
        
        <div class="web-container" id="webContainer">
            <!-- Character nodes will be generated here -->
        </div>

        <div class="info-panel" id="infoPanel">
            <div class="info-title" id="infoTitle">Select a character</div>
            <div class="info-ability" id="infoAbility">Click on any character to see their relationships</div>
            <ul class="relationships-list" id="relationshipsList"></ul>
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="legend-line" style="background: linear-gradient(90deg, #ff6b6b, #ffd93d); height: 4px;"></div>
                <span>Best Friends</span>
            </div>
            <div class="legend-item">
                <div class="legend-line" style="background: linear-gradient(90deg, #4ecdc4, #44a08d);"></div>
                <span>Close Friends</span>
            </div>
            <div class="legend-item">
                <div class="legend-line" style="background: linear-gradient(90deg, #ff758c, #ff7eb3);"></div>
                <span>Romantic Interest</span>
            </div>
            <div class="legend-item">
                <div class="legend-line" style="background: linear-gradient(90deg, #ff9500, #ff5722);"></div>
                <span>Rivalry/Frenemies</span>
            </div>
        </div>
    </div>

    <script>
        const characters = [
            {
                name: "Liam Reed",
                ability: "Fire",
                id: "liam",
                relationships: {
                    bestFriends: ["rowan", "jae"],
                    closeFriends: ["ben"],
                    romantic: ["rowan", "merula"],
                    rivalry: ["merula"]
                }
            },
            {
                name: "Rowan Khanna",
                ability: "Sound",
                id: "rowan",
                relationships: {
                    bestFriends: ["liam", "ben"],
                    closeFriends: ["jae"],
                    romantic: ["liam", "ben"],
                    rivalry: ["talbott"]
                }
            },
            {
                name: "Ben Copper",
                ability: "Earth",
                id: "ben",
                relationships: {
                    bestFriends: ["rowan"],
                    closeFriends: ["liam", "jae", "barnaby"],
                    romantic: ["rowan", "barnaby"]
                }
            },
            {
                name: "Jae Kim",
                ability: "Wind/Air",
                id: "jae",
                relationships: {
                    bestFriends: ["liam"],
                    closeFriends: ["ben", "rowan", "penny"],
                    romantic: ["liam", "merula"],
                    rivalry: ["merula"]
                }
            },
            {
                name: "Penny Haywood",
                ability: "Light",
                id: "penny",
                relationships: {
                    bestFriends: ["mayumi"],
                    closeFriends: ["chiara", "jae", "barnaby"],
                    romantic: ["mayumi", "barnaby"]
                }
            },
            {
                name: "Mayumi Sasaki",
                ability: "Nature",
                id: "mayumi",
                relationships: {
                    bestFriends: ["penny", "chiara"],
                    closeFriends: ["barnaby"],
                    romantic: ["penny", "chiara"]
                }
            },
            {
                name: "Chiara Lobosca",
                ability: "Water",
                id: "chiara",
                relationships: {
                    bestFriends: ["mayumi"],
                    closeFriends: ["penny", "barnaby"],
                    romantic: ["mayumi"]
                }
            },
            {
                name: "Tulip Karasu",
                ability: "Poison",
                id: "tulip",
                relationships: {
                    bestFriends: ["hayami"],
                    closeFriends: ["andre", "talbott"],
                    romantic: ["hayami"],
                    rivalry: ["hayami", "merula"]
                }
            },
            {
                name: "Hayami Amamiya",
                ability: "Lightning",
                id: "hayami",
                relationships: {
                    bestFriends: ["tulip"],
                    closeFriends: ["talbott", "andre"],
                    romantic: ["tulip"],
                    rivalry: ["tulip"]
                }
            },
            {
                name: "Talbott Winger",
                ability: "Ice",
                id: "talbott",
                relationships: {
                    bestFriends: ["andre"],
                    closeFriends: ["hayami", "tulip"],
                    romantic: ["andre"],
                    rivalry: ["rowan"]
                }
            },
            {
                name: "Andre Egwu",
                ability: "Crystal",
                id: "andre",
                relationships: {
                    bestFriends: ["talbott"],
                    closeFriends: ["tulip", "hayami"],
                    romantic: ["talbott"]
                }
            },
            {
                name: "Barnaby Lee",
                ability: "Metal",
                id: "barnaby",
                relationships: {
                    bestFriends: ["mayumi"],
                    closeFriends: ["ben", "chiara", "penny"],
                    romantic: ["ben", "penny"]
                }
            },
            {
                name: "Merula Snyde",
                ability: "Shadow",
                id: "merula",
                relationships: {
                    closeFriends: ["jae"],
                    romantic: ["liam", "jae"],
                    rivalry: ["liam", "jae", "tulip"]
                }
            }
        ];

        const positions = [
            { x: 200, y: 150 }, // liam
            { x: 400, y: 100 }, // rowan
            { x: 600, y: 180 }, // ben
            { x: 350, y: 280 }, // jae
            { x: 800, y: 120 }, // penny
            { x: 900, y: 300 }, // mayumi
            { x: 700, y: 350 }, // chiara
            { x: 150, y: 400 }, // tulip
            { x: 350, y: 500 }, // hayami
            { x: 550, y: 450 }, // talbott
            { x: 750, y: 550 }, // andre
            { x: 1000, y: 200 }, // barnaby
            { x: 200, y: 650 }  // merula
        ];

        function createCharacterNodes() {
            const container = document.getElementById('webContainer');
            
            characters.forEach((char, index) => {
                const node = document.createElement('div');
                node.className = `character-node char-${char.id}`;
                node.style.left = positions[index].x + 'px';
                node.style.top = positions[index].y + 'px';
                node.style.animationDelay = (index * 0.1) + 's';
                
                node.innerHTML = `
                    <div class="character-name">${char.name}</div>
                    <div class="character-ability">${char.ability}</div>
                `;
                
                node.addEventListener('click', () => showCharacterInfo(char));
                node.addEventListener('mouseenter', () => showConnections(char.id));
                node.addEventListener('mouseleave', () => hideConnections());
                
                container.appendChild(node);
            });
        }

        function createConnectionLines() {
            const container = document.getElementById('webContainer');
            
            characters.forEach((char, charIndex) => {
                Object.entries(char.relationships).forEach(([relationshipType, targets]) => {
                    targets.forEach(targetId => {
                        const targetIndex = characters.findIndex(c => c.id === targetId);
                        if (targetIndex !== -1) {
                            const line = document.createElement('div');
                            line.className = `connection-line ${relationshipType.replace(/([A-Z])/g, '-$1').toLowerCase()}`;
                            line.dataset.from = char.id;
                            line.dataset.to = targetId;
                            line.dataset.type = relationshipType;
                            
                            const fromPos = positions[charIndex];
                            const toPos = positions[targetIndex];
                            
                            const dx = toPos.x - fromPos.x;
                            const dy = toPos.y - fromPos.y;
                            const distance = Math.sqrt(dx * dx + dy * dy);
                            const angle = Math.atan2(dy, dx) * 180 / Math.PI;
                            
                            line.style.left = (fromPos.x + 60) + 'px';
                            line.style.top = (fromPos.y + 60) + 'px';
                            line.style.width = distance + 'px';
                            line.style.transform = `rotate(${angle}deg)`;
                            
                            container.appendChild(line);
                        }
                    });
                });
            });
        }

        function showConnections(characterId) {
            const lines = document.querySelectorAll('.connection-line');
            lines.forEach(line => {
                if (line.dataset.from === characterId || line.dataset.to === characterId) {
                    line.classList.add('visible');
                }
            });
        }

        function hideConnections() {
            const lines = document.querySelectorAll('.connection-line');
            lines.forEach(line => {
                line.classList.remove('visible');
            });
        }

        function showCharacterInfo(character) {
            const infoPanel = document.getElementById('infoPanel');
            const infoTitle = document.getElementById('infoTitle');
            const infoAbility = document.getElementById('infoAbility');
            const relationshipsList = document.getElementById('relationshipsList');
            
            infoTitle.textContent = character.name;
            infoAbility.textContent = `Special Ability: ${character.ability}`;
            
            relationshipsList.innerHTML = '';
            
            Object.entries(character.relationships).forEach(([type, targets]) => {
                targets.forEach(targetId => {
                    const targetChar = characters.find(c => c.id === targetId);
                    if (targetChar) {
                        const li = document.createElement('li');
                        const relationshipClass = type.replace(/([A-Z])/g, '-$1').toLowerCase();
                        li.className = `relationship-${relationshipClass}`;
                        li.textContent = `${getRelationshipLabel(type)}: ${targetChar.name}`;
                        relationshipsList.appendChild(li);
                    }
                });
            });
            
            infoPanel.classList.add('active');
            
            // Show all connections for this character
            showConnections(character.id);
        }

        function getRelationshipLabel(type) {
            const labels = {
                bestFriends: 'Best Friend',
                closeFriends: 'Close Friend',
                romantic: 'Romantic Interest',
                rivalry: 'Rival/Frenemy'
            };
            return labels[type] || type;
        }

        // Initialize the web
        createCharacterNodes();
        createConnectionLines();

        // Close info panel when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.character-node') && !e.target.closest('.info-panel')) {
                document.getElementById('infoPanel').classList.remove('active');
                hideConnections();
            }
        });
    </script>
</body>
</html>
